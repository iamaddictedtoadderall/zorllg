<html lang="en">

<style>
/* Look-test mockups: one corridor scene rendered in three candidate styles.
   Same geometry each time; only materials, lighting, post-processing and HUD change. */
:root{
  --sub-bg:rgba(4,8,10,.55);
  --sub-ink:#d8e6e4;
  --sub-name:#e8b45a;
  --hint:#7f9894;
  --f-sub:"IBM Plex Mono", ui-monospace, monospace;
  --sub-size:19px;
  color-scheme:dark;
}
body.ps1{--sub-bg:rgba(0,0,0,.7);--sub-ink:#c9e8b0;--sub-name:#f0d060;--hint:#7a9a6a;--f-sub:"VT323", ui-monospace, monospace;--sub-size:26px}
body.sterile{--sub-bg:rgba(250,250,248,.72);--sub-ink:#1c2226;--sub-name:#d2551e;--hint:#5e676c;--f-sub:"IBM Plex Sans", system-ui, sans-serif;--sub-size:18px}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--sub-ink);font-family:var(--f-sub)}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;inset:0;pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--sub-ink);opacity:.55}
#sub{position:absolute;left:50%;bottom:13vh;transform:translateX(-50%);max-width:min(760px,88vw);padding:10px 18px;background:var(--sub-bg);font-size:var(--sub-size);line-height:1.45;text-align:center;opacity:0;transition:opacity .4s}
#sub.on{opacity:1}
#sub b{color:var(--sub-name);font-weight:500;margin-right:.6em;letter-spacing:.08em}
body.sterile #sub{border-radius:3px}
#talk{position:absolute;left:50%;bottom:5vh;transform:translateX(-50%);width:min(560px,84vw);display:none;pointer-events:auto}
#talk.on{display:flex}
#talk span{padding:9px 10px 9px 14px;background:var(--sub-bg);color:var(--sub-name);font-size:calc(var(--sub-size) * .85)}
#talk input{flex:1;border:0;outline:0;padding:9px 14px 9px 0;background:var(--sub-bg);color:var(--sub-ink);font:inherit;font-size:calc(var(--sub-size) * .85)}
#hint{position:absolute;right:16px;bottom:calc(14px + env(safe-area-inset-bottom, 0px));font:inherit;font-size:calc(var(--sub-size) * .7);color:var(--hint);letter-spacing:.06em;background:none;border:0;padding:6px;pointer-events:auto;cursor:pointer}
#prompt{position:absolute;left:50%;top:calc(50% + 22px);transform:translateX(-50%);font-size:calc(var(--sub-size) * .7);color:var(--hint);opacity:0;transition:opacity .2s;letter-spacing:.06em}
#prompt.on{opacity:1}
#styles{position:fixed;top:calc(14px + env(safe-area-inset-top, 0px));left:16px;right:16px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto;z-index:3}
#styles button{font:12px "IBM Plex Mono",monospace;padding:6px 10px;background:rgba(0,0,0,.5);color:#ccc;border:1px solid #555;cursor:pointer}
#styles button.on{color:#fff;border-color:#e8b45a}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(0,0,0,.72);color:#cfd8d6;font-family:"IBM Plex Mono",monospace;cursor:pointer;z-index:2;text-align:center;padding:16px}
#start h1{font-weight:400;font-size:22px;letter-spacing:.3em;margin:0}
#start p{margin:0;font-size:13px;color:#8a9896}
body.shot #styles,body.shot #start{display:none}
</style>
</head>
<body>
<div id="hud">
  <div id="cross"></div>
  <div id="prompt">[E] INSPECT</div>
  <div id="sub"></div>
  <div id="talk"><span>&gt;</span><input id="talkIn" maxlength="200" autocomplete="off" spellcheck="false"></div>
  <button id="hint" type="button">[T] TALK</button>
</div>
<div id="styles">
  <button data-s="fog">1 · FOG &amp; GRAIN</button>
  <button data-s="ps1">2 · PS1</button>
  <button data-s="sterile">3 · STERILE</button>
</div>
<div id="start"><h1>CLICK TO WAKE</h1><p>WASD walk · mouse look · T talk · 1/2/3 switch look</p><p>Touch: drag to look · hold to walk</p><p>Look test only. The ship isn't connected yet.</p></div>

<script type="module">
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
const SHOT = params.has('shot');
if (SHOT) document.body.classList.add('shot');

const STYLES = {
  fog: {
    bg: 0x0a1214, fog: 0.07, ambient: [0x7fa6a8, 0x18160f, 1.1],
    lamp: 0xbfe4e6, lampPower: 16, glow: 0x7fe0e4, accent: 0xf0a640, wall: 0x56686a, metal: 0x3a4648, floor: 0x343c3c,
    scale: 0.8, grain: 0.09, scan: 0.06, vig: 0.55, quant: 0, aberr: 0.0016, tint: [0.96, 1.02, 1.03], lift: 0.012,
    snap: 0, nearest: false, blip: ['sine', 540], glass: .1,
  },
  ps1: {
    bg: 0x081008, fog: 0.085, ambient: [0x9ab88a, 0x141c10, 1.2],
    lamp: 0xd8f0b0, lampPower: 18, glow: 0x9cf07a, accent: 0xf0c040, wall: 0x5e6c4c, metal: 0x404a36, floor: 0x384030,
    scale: 0, grain: 0.0, scan: 0.0, vig: 0.3, quant: 24, aberr: 0, tint: [1, 1, 0.95], lift: 0.0,
    snap: 1, nearest: true, blip: ['square', 230], glass: .1,
  },
  sterile: {
    bg: 0xeef0ee, fog: 0.045, ambient: [0xffffff, 0xb8bcbc, 2.6],
    lamp: 0xffffff, lampPower: 6, glow: 0xdff4ff, accent: 0xd2551e, wall: 0xf4f6f4, metal: 0xd4d8d8, floor: 0xe0e2e0,
    scale: 1, grain: 0.025, scan: 0, vig: 0.25, quant: 0, aberr: 0, tint: [1, 1, 1], lift: 0.0,
    snap: 0, nearest: false, blip: ['triangle', 880], glass: .28,
  },
};
let styleKey = STYLES[params.get('style')] ? params.get('style') : 'fog';
let S = STYLES[styleKey];

// ---------- renderer & post ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: SHOT });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 80);
const scene = new THREE.Scene();
const rt = new THREE.WebGLRenderTarget(4, 4, { depthBuffer: true });

const post = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: rt.texture }, time: { value: 0 }, res: { value: new THREE.Vector2() },
    grain: { value: 0 }, scan: { value: 0 }, vig: { value: 0 }, quant: { value: 0 }, aberr: { value: 0 },
    tint: { value: new THREE.Vector3(1, 1, 1) }, lift: { value: 0 }, flick: { value: 0 },
  },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 res; uniform float time, grain, scan, vig, quant, aberr, lift, flick; uniform vec3 tint;
    varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + time * 7.13) * 43758.5453); }
    float bayer(vec2 p){ int x = int(mod(p.x, 4.)), y = int(mod(p.y, 4.));
      int i = x + y * 4; float m[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.); return m[i] / 16. - .5; }
    void main(){
      vec2 c = vUv - .5;
      vec3 col;
      if (aberr > 0.) col = vec3(texture2D(tDiffuse, vUv + c * aberr * 4.).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - c * aberr * 4.).b);
      else col = texture2D(tDiffuse, vUv).rgb;
      col = col * tint + lift;
      if (quant > 0.) col = floor(col * quant + bayer(vUv * res) * .9 + .5) / quant;
      col *= 1. - scan * (.5 + .5 * sin(vUv.y * res.y * 3.14159));
      col += (h(floor(vUv * res)) - .5) * grain;
      col *= 1. - vig * dot(c, c) * 1.6;
      col *= 1. - flick;
      gl_FragColor = vec4(col, 1.);
    }`,
  depthTest: false, depthWrite: false,
});
const postScene = new THREE.Scene();
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const rw = S.scale ? Math.round(w * S.scale) : Math.round(240 * w / h), rh = S.scale ? Math.round(h * S.scale) : 240;
  rt.setSize(rw, rh);
  const f = S.nearest ? THREE.NearestFilter : THREE.LinearFilter;
  rt.texture.minFilter = rt.texture.magFilter = f; rt.texture.needsUpdate = true;
  post.uniforms.res.value.set(rw, rh);
}
addEventListener('resize', resize);

// ---------- textures ----------
function canvasTex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; if (rep) t.repeat.set(...rep);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const grate = () => canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#9a9a9a'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#5c5c5c'; for (let i = 0; i < w; i += 8) g.fillRect(i, 0, 3, h);
  g.fillStyle = '#7a7a7a'; g.fillRect(0, 0, w, 3);
}, [6, 31]);
const panel = () => canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#a8a8a8'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#8a8a8a'; g.fillRect(0, 0, w, 4); g.fillRect(0, 0, 4, h); g.fillRect(0, 84, w, 2);
  g.fillStyle = '#bcbcbc'; g.fillRect(10, 96, 34, 6); g.fillRect(10, 106, 20, 4);
  for (let i = 0; i < 6; i++) { g.fillStyle = '#909090'; g.fillRect(70 + i * 8, 12, 4, 60); }
}, [12, 1]);

// ---------- world ----------
const LEN = 31, HALF = 3, H = 3.2;
let flickerLamp = null, trackingEye = null;
const lamps = [];

function snapMat(m) {
  if (!S.snap) return m;
  m.onBeforeCompile = sh => {
    sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n gl_Position.xy = floor(gl_Position.xy / gl_Position.w * vec2(140., 105.)) / vec2(140., 105.) * gl_Position.w;');
  };
  return m;
}
const std = (color, o = {}) => snapMat(new THREE.MeshStandardMaterial({ color, roughness: .85, metalness: .15, flatShading: true, ...o }));
function texed(t) { if (S.nearest) { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; } return t; }

function box(w, h, d, mat, x, y, z, shadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; scene.add(m); return m;
}

let rnd = 7; const rand = () => (rnd = (rnd * 16807) % 2147483647) / 2147483647;

function build() {
  scene.clear(); lamps.length = 0; rnd = 7;
  scene.background = new THREE.Color(S.bg);
  scene.fog = new THREE.FogExp2(S.bg, S.fog);
  scene.add(new THREE.HemisphereLight(S.ambient[0], S.ambient[1], S.ambient[2]));

  const wallM = std(S.wall, { map: texed(panel()) });
  const metalM = std(S.metal, { metalness: .5, roughness: .6 });
  const floorM = std(S.floor, { map: texed(grate()), metalness: .4 });
  const glowM = c => snapMat(new THREE.MeshStandardMaterial({ color: 0x111111, emissive: c, emissiveIntensity: 1.6, flatShading: true }));

  // shell
  box(HALF * 2, .1, LEN, floorM, 0, -.05, -LEN / 2 + 1, false);
  box(HALF * 2, .1, LEN, wallM, 0, H + .05, -LEN / 2 + 1, false);
  box(.1, H, LEN, wallM, -HALF - .05, H / 2, -LEN / 2 + 1, false);
  box(.1, H, LEN, wallM, HALF + .05, H / 2, -LEN / 2 + 1, false);
  box(HALF * 2, H, .1, wallM, 0, H / 2, 1.5, false);

  // pipes along ceiling corners
  for (const sx of [-1, 1]) for (const dy of [0, .22]) {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(.07, .07, LEN, 8), metalM);
    p.rotation.x = Math.PI / 2; p.position.set(sx * (HALF - .25 - dy * .6), H - .2 - dy, -LEN / 2 + 1); scene.add(p);
  }

  // ribs, pods, lamps
  for (let k = 0; k * 2.5 < LEN - 1; k++) {
    const z = -k * 2.5;
    box(.3, H, .35, metalM, -HALF + .15, H / 2, z); box(.3, H, .35, metalM, HALF - .15, H / 2, z);
    box(HALF * 2, .28, .35, metalM, 0, H - .14, z);

    if (k % 2 === 0) {
      const lit = k < 10;
      const lm = glowM(lit ? S.lamp : 0x000000);
      box(1.4, .05, .32, lm, 0, H - .3, z - 1.25, false);
      if (lit) {
        const L = new THREE.PointLight(S.lamp, S.lampPower, 9, 1.6);
        L.position.set(0, H - .45, z - 1.25);
        if (k === 0) { L.castShadow = true; L.shadow.mapSize.set(512, 512); }
        scene.add(L); lamps.push({ L, lm, base: S.lampPower });
        if (k === 4) flickerLamp = lamps[lamps.length - 1];
      }
    }

    // guide strip on the floor
    for (let j = 0; j < 3; j++) {
      const on = k < 7;
      box(.08, .02, .4, glowM(on ? S.accent : 0x000000), 0, .015, z - .4 - j * .85, false);
    }

    if (z - 1.25 < -LEN + 2.5) continue;
    for (const sx of [-1, 1]) {
      const pz = z - 1.25, px = sx * (HALF - .55);
      const open = sx === 1 && k === 1;
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(.5, 1.25, 4, 10), metalM);
      body.position.set(px + sx * .44, 1.15, pz); body.scale.set(.42, 1, 1.05); body.castShadow = body.receiveShadow = true; scene.add(body);
      // backlit sleeper: glowing rear panel, dark figure, frosted glass in front
      const back = new THREE.Mesh(new THREE.CapsuleGeometry(.36, 1.05, 4, 10), glowM(open ? 0x000000 : S.glow));
      back.scale.set(.2, 1, .85); back.position.set(px + sx * .26, 1.15, pz);
      back.material.emissiveIntensity = (S.glass < .2 ? 1.2 : .7) + rand() * .5; scene.add(back);
      const glassM = snapMat(new THREE.MeshStandardMaterial({
        color: S.glow, emissive: S.glow, emissiveIntensity: .08,
        transparent: true, opacity: S.glass, roughness: .15, metalness: .3, flatShading: true, depthWrite: false,
      }));
      const glass = new THREE.Mesh(new THREE.CapsuleGeometry(.42, 1.1, 4, 10), glassM);
      glass.scale.set(.5, 1, .9);
      if (open) { glass.position.set(px - sx * .3, 1.15, pz + .6); glass.rotation.y = sx * 1.1; }
      else glass.position.set(px - sx * .2, 1.15, pz);
      scene.add(glass);
      if (!open) {
        const fig = new THREE.Mesh(new THREE.CapsuleGeometry(.17, .95, 3, 8), std(0x040506));
        fig.position.set(px - sx * .02, 1.1, pz); scene.add(fig);
        const head = new THREE.Mesh(new THREE.SphereGeometry(.13, 8, 6), fig.material);
        head.position.set(px - sx * .02, 1.85, pz); scene.add(head);
      } else {
        const L = new THREE.PointLight(S.accent, 2.5, 3, 2); L.position.set(px - sx * .1, 1.4, pz); scene.add(L);
      }
      const r = rand();
      const st = open ? S.accent : r < .8 ? S.glow : r < .93 ? S.accent : 0x000000;
      box(.06, .06, .14, glowM(st), px - sx * .32, .32, pz, false);
      box(.9, .12, 1.1, metalM, px, .06, pz);
    }
  }

  // bulkhead + watching eyes
  const bz = -LEN + 2;
  box(HALF * 2, H, .3, metalM, 0, H / 2, bz);
  box(1.6, 2.3, .1, std(S.metal, { metalness: .7 }), 0, 1.15, bz + .18);
  box(1.6, .06, .05, glowM(S.accent), 0, 2.38, bz + .24, false);

  const eye = (x, y, z) => {
    const g = new THREE.Group(); g.position.set(x, y, z);
    const housing = new THREE.Mesh(new THREE.SphereGeometry(.16, 10, 8), metalM);
    const lens = new THREE.Mesh(new THREE.SphereGeometry(.06, 8, 6), glowM(S.accent));
    lens.position.z = .13; housing.add(lens); g.add(housing); scene.add(g);
    box(.06, .25, .06, metalM, x, y + .2, z, false);
    return housing;
  };
  eye(0, 2.75, bz + .35);
  trackingEye = eye(-HALF + .45, H - .45, -3.6);
}

// ---------- player ----------
const player = { pos: new THREE.Vector3(.5, 1.62, .4), yaw: 0.05, pitch: -0.03 };
const keys = {};
let locked = false;
const talk = document.getElementById('talk'), talkIn = document.getElementById('talkIn');

addEventListener('keydown', e => {
  if (document.activeElement === talkIn) {
    if (e.key === 'Escape') closeTalk();
    if (e.key === 'Enter' && talkIn.value.trim()) { const q = talkIn.value.trim(); closeTalk(); ask(q); }
    return;
  }
  keys[e.code] = true;
  if (e.code === 'KeyT') { e.preventDefault(); openTalk(); }
  if (e.key === '1') setStyle('fog'); if (e.key === '2') setStyle('ps1'); if (e.key === '3') setStyle('sterile');
});
addEventListener('keyup', e => keys[e.code] = false);
let dragging = false;
addEventListener('mousedown', e => { if (e.target === renderer.domElement) dragging = true; });
addEventListener('mouseup', () => dragging = false);
addEventListener('mousemove', e => {
  if (!locked && !dragging) return;
  player.yaw -= e.movementX * .0022; player.pitch = Math.max(-1.3, Math.min(1.3, player.pitch - e.movementY * .0022));
});
document.addEventListener('pointerlockchange', () => locked = document.pointerLockElement === renderer.domElement);
const start = document.getElementById('start');
function lock() { try { const p = renderer.domElement.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
start.addEventListener('click', () => { start.style.display = 'none'; audio(); lock(); intro(); });
renderer.domElement.addEventListener('click', () => { if (!locked && document.activeElement !== talkIn) lock(); });
document.getElementById('hint').addEventListener('click', e => { e.stopPropagation(); openTalk(); });
// touch: drag to look, hold to walk forward
let touch = null, holdTimer = 0;
renderer.domElement.addEventListener('touchstart', e => {
  const t = e.touches[0]; touch = { x: t.clientX, y: t.clientY };
  clearTimeout(holdTimer); holdTimer = setTimeout(() => keys.KeyW = true, 280);
}, { passive: true });
renderer.domElement.addEventListener('touchmove', e => {
  const t = e.touches[0]; if (!touch) return;
  player.yaw -= (t.clientX - touch.x) * .005; player.pitch = Math.max(-1.3, Math.min(1.3, player.pitch - (t.clientY - touch.y) * .005));
  touch = { x: t.clientX, y: t.clientY };
}, { passive: true });
renderer.domElement.addEventListener('touchend', () => { touch = null; clearTimeout(holdTimer); keys.KeyW = false; });

function openTalk() { talk.classList.add('on'); talkIn.value = ''; if (document.exitPointerLock) document.exitPointerLock(); setTimeout(() => talkIn.focus(), 0); }
function closeTalk() { talk.classList.remove('on'); talkIn.blur(); lock(); }

// ---------- subtitles + synth tones ----------
const sub = document.getElementById('sub');
let ac = null, typing = 0;
function audio() {
  if (ac) return;
  ac = new AudioContext();
  const master = ac.createGain(); master.gain.value = .9; master.connect(ac.destination);
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 140; lp.connect(master);
  for (const f of [46, 46.7, 92.3]) {
    const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
    const g = ac.createGain(); g.gain.value = .035; o.connect(g); g.connect(lp); o.start();
  }
  const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = buf.getChannelData(0);
  let last = 0; for (let i = 0; i < d.length; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3; }
  const n = ac.createBufferSource(); n.buffer = buf; n.loop = true;
  const nl = ac.createBiquadFilter(); nl.type = 'lowpass'; nl.frequency.value = 500;
  const ng = ac.createGain(); ng.gain.value = .25; n.connect(nl); nl.connect(ng); ng.connect(master); n.start();
}
function blip(ch) {
  if (!ac || ch === ' ') return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = S.blip[0]; o.frequency.value = S.blip[1] * (1 + (ch.charCodeAt(0) % 7) * .025);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.045, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + .06);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .07);
}
function say(text, hold = 3200) {
  const id = ++typing;
  return new Promise(res => {
    sub.classList.add('on');
    let i = 0;
    const step = () => {
      if (id !== typing) return res();
      sub.innerHTML = '<b>SHIP</b>' + text.slice(0, i).replace(/</g, '&lt;');
      if (i < text.length) { blip(text[i]); i++; setTimeout(step, ',.—'.includes(text[i - 1]) ? 220 : 34); }
      else setTimeout(() => { if (id === typing) sub.classList.remove('on'); res(); }, hold);
    };
    step();
  });
}
let thinking = 0;
async function ask(q) {
  thinking = 1;
  sub.classList.add('on'); sub.innerHTML = '<b>SHIP</b>· · ·';
  await new Promise(r => setTimeout(r, 1400));
  thinking = 0;
  say('(Look test. I am not connected yet.)');
}
async function intro() {
  await new Promise(r => setTimeout(r, 900));
  await say('Easy. Your legs will need a minute.', 1800);
  await say('I am bringing the lights up along the corridor. Follow them when you are ready.');
}

// ---------- loop ----------
const ray = new THREE.Raycaster(), prompt = document.getElementById('prompt');
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const t = now / 1000;

  const fwd = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), side = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  if (fwd || side) {
    const sp = 1.35 * dt, s = Math.sin(player.yaw), c = Math.cos(player.yaw);
    player.pos.x += (-s * fwd + c * side) * sp; player.pos.z += (-c * fwd - s * side) * sp;
    player.pos.x = Math.max(-1.6, Math.min(1.6, player.pos.x)); player.pos.z = Math.max(-LEN + 2.6, Math.min(1.1, player.pos.z));
  }
  const bob = (fwd || side) ? Math.sin(t * 7) * .025 : Math.sin(t * 1.3) * .006;
  camera.position.set(player.pos.x, player.pos.y + bob, player.pos.z);
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

  if (trackingEye) trackingEye.lookAt(camera.position);
  let fl = 0;
  if (flickerLamp) {
    const n = Math.sin(t * 13) + Math.sin(t * 29.7) + Math.sin(t * 3.1);
    const off = (n > 2.1 || thinking) && Math.sin(t * 60) > -.2;
    flickerLamp.L.intensity = off ? flickerLamp.base * .08 : flickerLamp.base;
    flickerLamp.lm.emissiveIntensity = off ? .1 : 1.6;
  }
  if (thinking) fl = .06 + Math.max(0, Math.sin(t * 23)) * .05;

  ray.setFromCamera({ x: 0, y: 0 }, camera);
  const hit = ray.intersectObjects(scene.children, false)[0];
  prompt.classList.toggle('on', !SHOT && !!hit && hit.distance < 1.6 && hit.object.geometry.type === 'CapsuleGeometry');

  post.uniforms.time.value = SHOT ? 1 : t; post.uniforms.flick.value = fl;
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  if (!SHOT) requestAnimationFrame(frame);
}

function setStyle(k) {
  styleKey = k; S = STYLES[k];
  document.body.className = (SHOT ? 'shot ' : '') + k;
  document.querySelectorAll('#styles button').forEach(b => b.classList.toggle('on', b.dataset.s === k));
  const u = post.uniforms;
  u.grain.value = S.grain; u.scan.value = S.scan; u.vig.value = S.vig; u.quant.value = S.quant; u.aberr.value = S.aberr; u.lift.value = S.lift;
  u.tint.value.set(...S.tint);
  build(); resize();
  if (!SHOT) history.replaceState(null, '', '?style=' + k);
}
document.querySelectorAll('#styles button').forEach(b => b.onclick = e => { e.stopPropagation(); setStyle(b.dataset.s); });

setStyle(styleKey);
if (SHOT) {
  player.pos.set(.35, 1.62, .9); player.yaw = .16; player.pitch = -.04;
  sub.classList.add('on'); sub.innerHTML = '<b>SHIP</b>I am bringing the lights up along the corridor. Follow them when you are ready.';
  talk.classList.add('on'); talkIn.value = 'who else is awake?';
  frame(performance.now()); frame(performance.now() + 16);
  document.fonts.ready.then(() => window.__ready = true);
} else requestAnimationFrame(frame);
</script>
</body>
