<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Worldroot Grove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: full-bleed pixelated 3D grove; HUD floats top, creature card at right, tabbed dock anchored bottom */
:root{
  --night:#0e1814;
  --panel:rgba(22,38,29,.92);
  --panel-2:#22392b;
  --edge:#3f5e48;
  --shade:#08100c;
  --ink:#eef2df;
  --muted:#a6b8a0;
  --gold:#f5cc6e;
  --gold-ink:#3a2a08;
  --lilac:#c6b4ff;
  --leaf:#93d39d;
  --rose:#f29b9b;
  --bubble:#f6f3e4;
  --bubble-ink:#1d2b21;
  --f-ui:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  --f-tag:"Silkscreen", "Pixelify Sans", ui-monospace, monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--f-ui);overflow:hidden;font-size:15px;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block;cursor:grab}
#c.placing{cursor:crosshair}
#bubbles,#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.panel{background:var(--panel);border:2px solid var(--edge);box-shadow:0 3px 0 var(--shade)}
.hud{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.hud > *{pointer-events:auto}
.essence{display:flex;gap:10px;align-items:center;padding:8px 14px 8px 10px}
.gem{width:18px;height:18px;background:var(--gold);transform:rotate(45deg);box-shadow:inset -4px -4px 0 #c99a3a, inset 3px 3px 0 #fff2c4;border:2px solid var(--gold-ink);flex:none;margin:0 4px}
.ess-num{font-size:24px;font-weight:700;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.ess-rate{font-family:var(--f-tag);font-size:10px;color:var(--muted);letter-spacing:.04em;margin-top:3px}
.hud-right{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{padding:7px 12px;font-size:14px;white-space:nowrap}
.btn-ghost{cursor:pointer}
.btn-ghost:hover{background:var(--panel-2)}
#jBtn{position:relative}
#fade{position:absolute;inset:0;background:var(--night);opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
.it-sub.two{white-space:normal}
.jdot{position:absolute;top:-4px;right:-4px;width:10px;height:10px;background:var(--gold);border:2px solid var(--gold-ink)}
.jsec{margin-top:12px}
.jsec h3{margin:0 0 6px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.jsec h3 small{font-family:var(--f-tag);font-size:10px;color:var(--muted);letter-spacing:.05em}
.jprog{height:10px;background:var(--shade);border:2px solid var(--edge);position:relative;margin:2px 0 4px}
.jprog i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.jc{display:flex;gap:8px;align-items:center;padding:6px 8px;background:rgba(0,0,0,.18);min-width:0}
.jc.locked{opacity:.55}
.jc .it-main{min-width:0}
.jc .it-name{font-size:14px}
.jc .it-sub{overflow-wrap:anywhere}
.jicon{width:26px;height:26px;flex:none;border:2px solid var(--shade);display:grid;place-items:center;font-size:14px;background:var(--panel-2);color:var(--gold)}
.t-common{background:var(--edge);color:var(--ink)}

.log{position:absolute;left:12px;top:calc(76px + env(safe-area-inset-top,0px));display:grid;gap:4px;max-width:min(360px,calc(100% - 24px));pointer-events:none}
.log div{font-size:13px;color:var(--ink);text-shadow:0 2px 0 var(--shade),0 0 6px rgba(0,0,0,.6);transition:opacity .6s}

.hint{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 14px;font-size:14px;color:var(--gold);pointer-events:none;animation:nudge 1.6s ease-in-out infinite;white-space:nowrap}
@keyframes nudge{50%{transform:translate(-50%,-5px)}}

.toast{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:9px 16px;font-size:15px;max-width:calc(100% - 32px);text-align:center;background:var(--panel-2);border:2px solid var(--gold);box-shadow:0 3px 0 var(--shade);pointer-events:none}

/* Creature card */
.card{position:absolute;right:12px;top:calc(68px + env(safe-area-inset-top,0px));width:270px;padding:12px;display:grid;gap:9px}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.c-name{font-size:22px;font-weight:700;line-height:1.05;text-wrap:balance}
.c-sub{color:var(--muted);font-size:13px;margin-top:3px}
.x{background:none;border:2px solid var(--edge);width:30px;height:30px;cursor:pointer;line-height:1;font-size:18px;flex:none}
.x:hover{background:var(--panel-2)}
.tag{font-family:var(--f-tag);font-size:10px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;min-width:46px;display:inline-block}
.c-row{display:flex;gap:8px;font-size:14px;align-items:baseline}
.c-row span:last-child{min-width:0}
.mood{display:flex;gap:8px;align-items:center;font-size:13px}
.bar{flex:1;height:10px;background:var(--shade);border:2px solid var(--edge);position:relative;min-width:0}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--rose);display:block}
.c-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel-2);border:2px solid var(--edge);box-shadow:0 2px 0 var(--shade);padding:6px 12px;cursor:pointer;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--leaf)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold-ink);font-weight:600}
.btn.lilac{background:var(--lilac);color:#241a48;border-color:#241a48;font-weight:600}

/* Dock */
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(580px,calc(100% - 24px));display:grid;gap:8px}
.dock-panel{max-height:min(46vh,430px);overflow:auto;padding:12px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{background:var(--panel);border:2px solid var(--edge);box-shadow:0 3px 0 var(--shade);padding:10px 4px;cursor:pointer;font-size:15px;font-weight:500}
.tab:hover{background:var(--panel-2)}
.tab[aria-selected="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold-ink)}
.ph h2{margin:0;font-size:18px;font-weight:700}
.ph p{margin:3px 0 10px;color:var(--muted);font-size:13px;max-width:60ch}
.list{display:grid;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:7px 8px;background:rgba(0,0,0,.18);border:2px solid transparent}
.item.locked{opacity:.5}
.item.clickable{cursor:pointer}
.item.clickable:hover{border-color:var(--edge)}
.sw{width:26px;height:26px;flex:none;border:2px solid var(--shade);background:linear-gradient(135deg,var(--a) 0 55%,var(--b) 55% 100%);image-rendering:pixelated}
.it-main{flex:1;min-width:0}
.it-name{font-size:15px;font-weight:600}
.it-sub{font-size:12px;color:var(--muted);margin-top:1px}
.chip{font-family:var(--f-tag);font-size:9px;letter-spacing:.05em;color:#241a48;background:var(--lilac);padding:1px 4px;vertical-align:2px;margin-left:4px}
.tchip{font-family:var(--f-tag);font-size:9px;letter-spacing:.05em;padding:1px 4px;vertical-align:2px;margin-left:4px;white-space:nowrap}
.t-uncommon{background:var(--leaf);color:#14301c}
.t-rare{background:var(--lilac);color:#241a48}
.t-legend{background:var(--gold);color:var(--gold-ink)}
.lock{font-family:var(--f-tag);font-size:10px;color:var(--muted)}
.buy{min-width:84px;font-variant-numeric:tabular-nums}
.foot{color:var(--muted);font-size:12px;margin:10px 0 0}
.mini-bar{width:54px;height:7px;background:var(--shade);border:1px solid var(--edge);position:relative;flex:none}
.mini-bar i{position:absolute;inset:0 auto 0 0;background:var(--rose)}
.stages{display:flex;gap:6px;margin:6px 0 12px}
.stages span{flex:1;height:10px;background:var(--shade);border:2px solid var(--edge)}
.stages span.on{background:var(--leaf)}
.tree-next{padding:10px;background:rgba(0,0,0,.18);display:grid;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.stats div{background:rgba(0,0,0,.18);padding:8px;text-align:center}
.stats b{display:block;font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums}
.stats small{font-family:var(--f-tag);font-size:9px;color:var(--muted);letter-spacing:.05em}

.placebar{position:absolute;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));display:flex;gap:12px;align-items:center;padding:8px 10px 8px 14px;max-width:calc(100% - 24px)}

/* Speech + emote bubbles */
.bubble{position:absolute;left:0;top:0;background:var(--bubble);color:var(--bubble-ink);border:2px solid var(--bubble-ink);padding:1px 6px 2px;font-size:14px;font-weight:600;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.35);will-change:transform}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:6px;height:6px;background:var(--bubble);border-right:2px solid var(--bubble-ink);border-bottom:2px solid var(--bubble-ink);transform:translateX(-50%) rotate(45deg)}
.bubble.talk{font-weight:500;font-size:13px}
.plus{position:absolute;color:var(--gold);font-weight:700;font-size:20px;text-shadow:0 2px 0 var(--gold-ink);animation:rise .9s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes rise{to{opacity:0;transform:translate(-50%,-180%)}}

@media (max-width:640px){
  .card{left:12px;right:12px;width:auto;top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .ess-num{font-size:20px}
  .tab{font-size:13px;padding:9px 2px}
  .log{top:calc(70px + env(safe-area-inset-top,0px))}
  .log div{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  .hint{animation:none}
  .plus{animation-duration:.01s}
}
</style>
</head>
<body>

<div id="app">
  <canvas id="c" aria-label="Your world tree grove. Tap the tree to gather essence."></canvas>
  <div id="bubbles"></div>
  <div id="fx"></div>
  <div id="fade"></div>

  <header class="hud">
    <div class="panel essence">
      <span class="gem" aria-hidden="true"></span>
      <div>
        <div id="ess" class="ess-num">0</div>
        <div id="rate" class="ess-rate">+0/S</div>
      </div>
    </div>
    <div class="hud-right">
      <button id="mBtn" class="panel pill btn-ghost" aria-label="Open map">Map</button>
      <button id="jBtn" class="panel pill btn-ghost" aria-label="Open journal">Journal<span id="jDot" class="jdot" hidden></span></button>
      <div id="clock" class="panel pill">☀ Day</div>
      <button id="snd" class="panel pill btn-ghost" aria-label="Toggle sound">♪ On</button>
    </div>
  </header>

  <div id="log" class="log" aria-live="polite"></div>
  <div id="hint" class="panel hint">Tap the tree to gather essence</div>
  <div id="toast" class="toast" hidden></div>

  <div id="placebar" class="panel placebar" hidden>
    <span id="placeTxt">Tap the ground to place it</span>
    <button id="placeCancel" class="btn">Cancel</button>
  </div>

  <aside id="card" class="panel card" hidden>
    <div class="card-top">
      <div><div id="cName" class="c-name"></div><div id="cSub" class="c-sub"></div></div>
      <button id="cClose" class="x" aria-label="Close">×</button>
    </div>
    <div class="mood"><span class="tag">Mood</span><div class="bar"><i id="cMood"></i></div><span id="cMoodTxt"></span></div>
    <div class="c-row"><span class="tag">Now</span><span id="cAct"></span></div>
    <div class="c-row"><span class="tag">Loves</span><span id="cFav"></span></div>
    <div class="c-row"><span class="tag">Brings</span><span id="cRate"></span></div>
    <div class="c-btns">
      <button id="cPet" class="btn">Pet</button>
      <button id="cTreat" class="btn gold">Treat</button>
      <button id="cFriend" class="btn lilac" hidden>Befriend</button>
      <button id="cWatch" class="btn">Close up</button>
    </div>
  </aside>

  <nav id="dock" class="dock">
    <div id="panel" class="panel dock-panel" hidden><div id="panelBody"></div></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="creatures" aria-selected="false">Creatures</button>
      <button class="tab" role="tab" data-tab="decor" aria-selected="false">Decor</button>
      <button class="tab" role="tab" data-tab="friends" aria-selected="false">Friends</button>
      <button class="tab" role="tab" data-tab="tree" aria-selected="false">Tree</button>
    </div>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

// whole coat onto a new palette; very rare ones also glow, shimmer or shift over time.
const TIERS={
  natural:{name:'Natural',odds:0,bonus:1},
  uncommon:{name:'Uncommon',odds:.22,bonus:1.1},
  rare:{name:'Rare',odds:.07,bonus:1.25},
  legend:{name:'Very rare',odds:.01,bonus:1.5}
};
const TINTS={
  natural:{name:'Natural',tier:'natural'},
  pale:{name:'Pale',tier:'uncommon',hsl:[0,.55,.12]},
  dusky:{name:'Dusky',tier:'uncommon',hsl:[0,.8,-.1]},
  russet:{name:'Russet',tier:'uncommon',hsl:[-.03,1.15,-.03]},
  sandy:{name:'Sandy',tier:'uncommon',hsl:[.11,.7,.05],pull:.4},
  smoky:{name:'Smoky',tier:'uncommon',hsl:[0,.25,-.04]},
  frost:{name:'Frost',tier:'rare',map:[0x5b7ea6,0xa9d4ee,0xf2fbff]},
  ember:{name:'Ember',tier:'rare',map:[0x5a1a12,0xd8542a,0xffc36a]},
  moss:{name:'Moss',tier:'rare',map:[0x2f4a22,0x6f9a48,0xd2e6a0]},
  rose:{name:'Rose',tier:'rare',map:[0x7a3450,0xe08aa8,0xffe1ec]},
  midnight:{name:'Midnight',tier:'rare',map:[0x141a3a,0x34407e,0x8d9ad6]},
  lilac:{name:'Lilac',tier:'rare',map:[0x4e3a78,0xa78be0,0xf0e6ff]},
  golden:{name:'Golden',tier:'legend',map:[0x6a4a10,0xe0a93a,0xfff0b0],live:'shimmer'},
  shadow:{name:'Shadow',tier:'legend',map:[0x0e0e14,0x2a2a38,0x5a5a70],eye:0x9df5ff},
  prismatic:{name:'Prismatic',tier:'legend',map:[0x444444,0x999999,0xeeeeee],live:'prism'},
  ghost:{name:'Ghost',tier:'legend',map:[0x7d93a8,0xcfe3ef,0xffffff],glow:0x3a5a70},
  celestial:{name:'Celestial',tier:'legend',map:[0x0d1440,0x2a3a9a,0x9fb2ff],specks:true}
};
Object.keys(TINTS).forEach(k=>TINTS[k].id=k);
function rollTint(boost){
  const r=Math.random(), b=boost||1, L=TIERS.legend.odds*b, R=TIERS.rare.odds*b, U=TIERS.uncommon.odds;
  const tier=r<L?'legend':r<L+R?'rare':r<L+R+U?'uncommon':'natural';
  return pick(Object.values(TINTS).filter(t=>t.tier===tier));
}
const _hsl={h:0,s:0,l:0}, _c=new THREE.Color(), _c2=new THREE.Color();
function tintColor(t,hex){
  _c.setHex(hex).getHSL(_hsl);
  if(t.hsl){
    let h=_hsl.h; if(t.pull) h=lerp(h,t.hsl[0],t.pull); else h=(h+t.hsl[0]+1)%1;
    _c.setHSL(h,clamp(_hsl.s*t.hsl[1],0,1),clamp(_hsl.l+t.hsl[2],0,1)); return _c.getHex();
  }
  const k=clamp((_hsl.l-.1)/.8,0,1), m=t.map, i=k<.5?0:1, f=k<.5?k*2:(k-.5)*2;
  _c2.setHex(m[i]).lerp(_c.setHex(m[i+1]),f);
  return _c.setHex(hex).lerp(_c2,.85).getHex();
}
const tintMats={};
function tintMat(t,m,hex){
  const basic=m.isMeshBasicMaterial, key=t.id+':'+hex+':'+(basic?'b':'l')+':'+(m.transparent?m.opacity:1);
  if(tintMats[key]) return tintMats[key];
  let mat=m.transparent?halo(hex,m.opacity):M(hex,basic);
  if(t.glow&&!basic){mat=mat.clone(); mat.emissive.setHex(t.glow);}
  return tintMats[key]=mat;
}
function applyTint(root,t){
  if(!t||t.tier==='natural') return;
  const P=root.userData.parts, eyes=new Set(); P.eyes.forEach(E=>E.traverse(o=>eyes.add(o)));
  root.updateMatrixWorld(true);
  const live=t.live?[]:null, body=[], wp=new V();
  root.traverse(o=>{
    if(!o.isMesh||o.userData.noTint) return;
    const m=o.material, hex=m.color.getHex(), shine=m.isMeshBasicMaterial&&hex===WHITE;
    if(eyes.has(o)){ if(t.eye&&!shine) o.material=M(t.eye,true); return; }
    _c.setHex(hex).getHSL(_hsl); if(shine||_hsl.l<.12) return;
    const out=tintColor(t,hex);
    if(live){const mat=m.clone(); mat.color.setHex(out); o.material=mat; live.push({mat,l:_hsl.l,y:o.getWorldPosition(wp).y});}
    else o.material=tintMat(t,m,out);
    if(!m.transparent&&o.scale.x>.08) body.push(o);
  });
  if(live) P.tintLive={kind:t.live,mats:live};
  if(t.specks) for(let i=0;i<Math.min(7,body.length);i++){
    const o=body.splice(Math.floor(Math.random()*body.length),1)[0], s=root.userData.size*.035;
    B(o.parent,s,s,s,0xeef2ff,o.position.x+rand(-.4,.4)*o.scale.x,o.position.y+o.scale.y/2+.005,o.position.z+rand(-.4,.4)*o.scale.z,true);
  }
}
function tintAnim(P,t,seed){
  const L=P.tintLive; if(!L) return;
  if(L.kind==='shimmer') L.mats.forEach(q=>{if(q.mat.emissive) q.mat.emissive.setHSL(.12,.8,.04+.12*Math.max(0,Math.sin(t*3-q.y*5+seed)));});
  else L.mats.forEach(q=>q.mat.color.setHSL((t*.06+q.l*.35+q.y*.25+seed)%1,.65,clamp(q.l*.85+.08,0,.92)));
}
const coatHex=(c,hex)=>c.tint.tier==='natural'?hex:tintColor(c.tint,hex);
const tierChip=t=>t&&t.tier!=='natural'?`<span class="tchip t-${t.tier}">${t.name.toUpperCase()}</span>`:'';

/* ---------- Creature logic ---------- */
const minR=sp=>treeInfo.r*1.45+.3+sp.size*.25;

function hidePoint(sp){const a=cam.theta+Math.PI+rand(-.5,.5), r=minR(sp)+.1; return new V(Math.sin(a)*r,0,Math.cos(a)*r);}
function skyPoint(sp){const h=treeInfo.h, a=rand(0,TAU), r=sp.big?rand(10,17):rand(treeInfo.r+1.6,Math.min(14,3+h*.85)); return new V(Math.cos(a)*r,Math.max(1.2,rand(sp.yMin,sp.yMax)*h+.4),Math.sin(a)*r);}

function near(p,d){const a=rand(0,TAU); return new V(p.x+Math.cos(a)*d,0,p.z+Math.sin(a)*d);}
function decorSpot(d,spread,face){const a=rand(0,TAU),r=face?spread:spread*rand(.3,1); return {target:new V(d.pos.x+Math.cos(a)*r,0,d.pos.z+Math.sin(a)*r),faceTarget:face?d.pos.clone():null};}

function constrain(v,sp,leaving){
  const r=Math.hypot(v.x,v.z);
  if(sp.kind==='fly'){const mn=treeInfo.r+1; if(r<mn&&v.y<treeInfo.h*1.05){const k=mn/Math.max(r,.01); v.x*=k; v.z*=k;} return v;}
  if(sp.kind==='climb') {if(r>CLEAR_R&&!leaving){const k=CLEAR_R/r; v.x*=k; v.z*=k;} return v;}
  const mn=minR(sp);
  if(r<mn){const k=mn/Math.max(r,.01); v.x*=k; v.z*=k;}
  else if(r>CLEAR_R&&!leaving){const k=CLEAR_R/r; v.x*=k; v.z*=k;}
  return v;
}
function climbPath(from,to){
  const R=treeInfo.r*.92+.18, pts=[], af=Math.atan2(from.z,from.x), at=Math.atan2(to.z,to.x), up=to.y>.6, fromUp=from.y>.6;
  if(fromUp&&up){pts.push(new V(Math.cos(af)*R,from.y,Math.sin(af)*R)); pts.push(new V(Math.cos(at)*R,to.y,Math.sin(at)*R));}
  else if(fromUp){pts.push(new V(Math.cos(af)*R,from.y,Math.sin(af)*R)); pts.push(new V(Math.cos(af)*R,.05,Math.sin(af)*R)); pts.push(new V(Math.cos(af)*(R+.5),0,Math.sin(af)*(R+.5)));}
  else if(up){pts.push(new V(Math.cos(at)*(R+.5),0,Math.sin(at)*(R+.5))); pts.push(new V(Math.cos(at)*R,.05,Math.sin(at)*R)); pts.push(new V(Math.cos(at)*R,to.y,Math.sin(at)*R));}
  pts.push(to.clone()); return pts;

function weighted(opts){let s=0; opts.forEach(o=>s+=o.w); let r=Math.random()*s; for(const o of opts){if((r-=o.w)<=0) return o;} return opts[0];}

function chooseActivity(c){
  const sp=c.sp, W=PERS[c.pers].w, opts=[], night=state.night>.6;
  const add=(type,w,o)=>{w*=(W[type]||1); if(w>.001) opts.push(Object.assign({type,w},o));};
  if(c.leaving){const p=c.mesh.position,a=Math.atan2(p.z,p.x); return {type:'leave',target:new V(Math.cos(a)*22,0,Math.sin(a)*22),dur:.1,label:'heading back to the forest'};}
  if(sp.kind==='fly'){
    add('glide',3,{target:skyPoint(sp),dur:rand(.5,2),label:'gliding around the tree'});
    add('loop',sp.big?3:1.4,{loop:true,dur:sp.big?rand(14,24):rand(8,14),label:sp.big?'drifting around the canopy':'circling the canopy',emote:sp.big?'~':null});
    if(sp.perch&&treeInfo.perches.length){const sleepy=sp.nocturnal?!night:night; add(sleepy?'nap':'perch',sleepy?4:2.5,{target:perchPoint(),dur:rand(10,18),label:sleepy?'snoozing on a branch':'perched on a branch',emote:sleepy?'z':'♪'});}
    if(night) add('stargaze',1.2,{target:skyPoint(sp),dur:rand(5,9),label:'stargazing',emote:'✦'});
    eventReact(c,add); if(SPECIAL[sp.id]) SPECIAL[sp.id](c,add,night);
    {const bb=decorOf('birdbath'); if(bb.length&&!sp.big){const d=pick(bb); add('bathe',1.4,{target:d.pos.clone().add(new V(0,.86,0)),dur:rand(6,10),label:'splashing in the bird bath',emote:'~'});}}
    if(sp.id==='glowmoth'){const l=decorOf('lantern'); if(l.length){const d=pick(l); add('bask',night?4:1,{target:d.pos.clone().add(new V(rand(-.4,.4),1.4+rand(0,.5),rand(-.4,.4))),dur:rand(6,10),label:'fluttering around a lantern',emote:'✦'});}}
    return weighted(opts);
  }
  if(sp.kind==='climb'&&treeInfo.perches.length) add('perch',3,{target:perchPoint(),dur:rand(8,14),label:'scampering along a branch',emote:'♪'});
  const home=sp.home&&(one(sp.home)||areaWater());
  add('wander',sp.kind==='roots'?1.5:2,{target:home?near(home.pos,rand(1.6,4)):groundPoint(sp),dur:rand(.5,2.5),label:'wandering about'});
  add('nap',night?2.5:.9,{target:napPoint(sp),dur:rand(12,20),label:'napping',emote:'z'});
  const pickD=t=>{const a=decorOf(t); return a.length?pick(a):null;};
  let d;
  if((d=pickD('berrybush'))) add('eat',2,Object.assign(decorSpot(d,.85,true),{dur:rand(6,10),label:'nibbling berries',emote:'nom'}));

function eventReact(c,add){

function startActivity(c){

function announce(c){

  else if(Math.random()<.06) bubble(c,pick(PERS[c.pers].lines),3.2);
  if(a.type!=='wander'&&a.type!=='glide'&&Math.random()<.3) log(`${c.name} the ${c.sp.name} is ${a.label}.`);
}
const GAIN={catch:5,chase:3,wander:1,glide:1.5,loop:3,explore:3,nap:3,hide:2,stargaze:3,play:4,social:4,perch:3,dig:4,shelter:2};
function finish(c){

  c.happy=clamp(c.happy+gain,5,100);
  if(a.partner&&creatures.includes(a.partner)) a.partner.happy=clamp(a.partner.happy+2,5,100);

}
function resetPose(c){const P=c.mesh.userData.parts; P.g.position.set(0,0,0); P.g.rotation.set(0,0,0); if(P.throat) P.throat.scale.y=P.throat.userData.h; P.g.scale.set(1,1,1); if(P.head) P.head.rotation.x=0;}
function lerpAngle(a,b,t){let d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI; return a+d*t;}
const tmpV=new V(), tmpT=new V();

function updateCreature(c,dt,t){

  const fly=sp.kind==='fly', climb=sp.kind==='climb';
  c.happy=clamp(c.happy+(mod('mood')-.12)*dt,5,100); c.petCD=Math.max(0,c.petCD-dt);
  let moving=false;
  if(c.mode==='move'){
    c.moveT+=dt;
    const tgt=c.follow?tmpT.copy(c.follow.mesh.position):c.path[0];
    if(!tgt||(c.follow&&!creatures.includes(c.follow))){arrive(c);}
    else{
      tmpV.subVectors(tgt,p); if(!fly&&!climb) tmpV.y=0;
      const dist=tmpV.length(), reach=c.follow?.8+s*.4:.12;
      if(dist<=reach||c.moveT>(c.follow?8:22)){ if(c.follow) arrive(c); else {c.path.shift(); if(!c.path.length) arrive(c);} }
      else{const spd=sp.speed*(climb&&p.y>.3?.75:1); tmpV.multiplyScalar(Math.min(dist,spd*dt)/dist); p.add(tmpV); if(Math.abs(tmpV.x)+Math.abs(tmpV.z)>1e-4) c.mesh.rotation.y=lerpAngle(c.mesh.rotation.y,Math.atan2(tmpV.x,tmpV.z),1-Math.pow(.0005,dt)); moving=true;}
    }
  } else if(c.mode==='do'){
    c.timer-=dt; const a=c.act.type;
    if(a==='nap'){g.scale.y=lerp(g.scale.y,.8,dt*3); if(c.bubbleT<=0&&Math.random()<dt*.35) bubble(c,'z z');}
    else if(a==='dance'){g.position.y=Math.abs(Math.sin(t*7+c.seed))*.25*s; c.mesh.rotation.y+=dt*2.5; if(c.bubbleT<=0&&Math.random()<dt*.4) bubble(c,'♪');}
    else if(a==='eat'||a==='drink'){if(P.head) P.head.rotation.x=.45+Math.sin(t*12+c.seed)*.25;}
    else if(a==='dig'){g.position.y=lerp(g.position.y,-.28*s,dt*2); if(P.head) P.head.rotation.x=.45+Math.sin(t*14)*.3; if(Math.random()<dt*3) burst(p.clone().add(new V(0,.1,0)),0x7a5a3a,1,.6);}
    else if(a==='catch'){g.position.y=Math.abs(Math.sin(t*5+c.seed))*.2*s; if(P.head) P.head.rotation.x=lerp(P.head.rotation.x,-.45,dt*4);}
    else if(a==='stargaze'){if(P.head) P.head.rotation.x=lerp(P.head.rotation.x,-.55,dt*3);}
    else if(a==='hide'){g.scale.setScalar(lerp(g.scale.x,.86,dt*2));}
    else if(a==='loop'){c.loopA+=dt*sp.speed/c.loopR*c.loopDir; p.x=Math.cos(c.loopA)*c.loopR; p.z=Math.sin(c.loopA)*c.loopR; p.y=c.loopY+Math.sin(t*.7+c.seed)*.5; c.mesh.rotation.y=Math.atan2(-Math.sin(c.loopA)*c.loopDir,Math.cos(c.loopA)*c.loopDir); moving=true;}
    else if(a==='play'&&c.follow&&creatures.includes(c.follow)){
      tmpV.subVectors(c.follow.mesh.position,p); tmpV.y=0; const dist=tmpV.length();
      if(dist>1){tmpV.multiplyScalar(Math.min(dist,sp.speed*1.25*dt)/dist); p.add(tmpV); c.mesh.rotation.y=Math.atan2(tmpV.x,tmpV.z); moving=true;}
      else g.position.y=Math.abs(Math.sin(t*10))*.12*s;
    }
    else if(a==='swing'){const d=c.act.decor; g.position.z=-Math.sin(d?d.swingA:0)*.95;}
    else if(a==='croak'){if(P.throat) P.throat.scale.y=P.throat.userData.h*(1+Math.max(0,Math.sin(t*6+c.seed))*.9); if(c.bubbleT<=0&&Math.random()<dt*.5){bubble(c,'ribbit!'); tone(150+Math.random()*50,.18,.025);}}
    else if(a==='paddle'){g.rotation.z=Math.sin(t*2+c.seed)*.06; if(c.bubbleT<=0&&Math.random()<dt*.15) bubble(c,'quack!');}
    else if(a==='swim'){g.rotation.z=lerp(g.rotation.z,Math.PI,dt*4); g.rotation.x=Math.sin(t*1.2+c.seed)*.06;}
    else if(a==='bathe'){g.position.y=Math.abs(Math.sin(t*9+c.seed))*.06; if(c.bubbleT<=0&&Math.random()<dt*.3) bubble(c,'~');}
    else {g.scale.y=1+Math.sin(t*2+c.seed)*.025;}
    if(c.act.lift!=null) g.position.y=lerp(g.position.y,c.act.lift+(a==='soak'?Math.sin(t*1.5+c.seed)*.02:0),dt*6);
    if(c.timer<=0) finish(c);
  }
  // legs & bob
  if(P.legs.length){
    P.legs.forEach((L,i)=>{const ph=(i===0||i===3)?0:Math.PI; L.rotation.x=moving?Math.sin(t*sp.speed*7+ph)*.7:lerp(L.rotation.x,0,dt*8);});
    if(moving&&!fly) g.position.y=Math.abs(Math.sin(t*sp.speed*7))*(sp.hopAmp||(sp.hop?.14:.035))*s;
  }
  if(P.tail&&sp.shape==='quad') P.tail.rotation.y=Math.sin(t*(3+amtOf('wind')*4)+c.seed)*(.3+amtOf('wind')*.3);
  if(P.tail&&sp.shape==='whale') P.tail.rotation.x=Math.sin(t*1.5+c.seed)*.25;
  if(P.wings.length){
    const resting=c.mode==='do'&&(c.act.type==='perch'||c.act.type==='nap');
    const rate=sp.wingRate||(sp.shape==='moth'?24:sp.shape==='whale'?1.6:sp.wings?9:sp.variant==='phoenix'?8:12);
    const amp=sp.wingAmp||(sp.shape==='whale'?.3:sp.wingRate?.9:.7);
    P.wings.forEach(W=>{const base=W.userData.base||0; W.rotation.z=resting?lerp(W.rotation.z,base,dt*6):base+W.userData.k*Math.sin(t*rate+c.seed)*amp;});
  }
  // height + bounds
  if(fly){ if(!(c.mode==='do'&&(c.act.type==='perch'||c.act.type==='nap'||c.act.type==='bathe'))&&c.act.type!=='loop') g.position.y=Math.sin(t*2.2+c.seed)*.12; constrain(p,sp); }

}

const parts=[]; const partGeo=new THREE.BoxGeometry(.1,.1,.1);
function burst(pos,color,n,spread){for(let i=0;i<n;i++){let pt=parts.find(q=>q.life<=0); if(!pt){if(parts.length>90) return; pt={m:new THREE.Mesh(partGeo,M(color,true)),v:new V(),life:0}; scene.add(pt.m); parts.push(pt);} pt.m.material=M(color,true); pt.m.visible=true; pt.m.position.copy(pos); pt.v.set(rand(-1,1)*(spread||1),rand(1.5,3.2),rand(-1,1)*(spread||1)); pt.life=rand(.7,1.1);}}
function updateParts(dt){parts.forEach(q=>{if(q.life<=0) return; q.life-=dt; q.v.y-=4*dt; q.m.position.addScaledVector(q.v,dt); q.m.scale.setScalar(Math.max(.01,q.life)); if(q.life<=0) q.m.visible=false;});}

/* ---------- Camera ---------- */
const cam={tPhi:null,theta:.7,phi:1.12,dist:12,tDist:12,look:new V(0,1,0),tLook:new V(0,1,0)};
function camDefaults(){const h=STAGES[state.stage].h; cam.tDist=8+h*1.55; cam.tLook.set(0,h*.42,0);}
function camLimits(){if(follow) return [.9+follow.sp.size*1.2,10+follow.sp.size*4]; const h=STAGES[state.stage].h; return [4.5,30+h*1.6];}
const camRay=new THREE.Raycaster(), camDir=new V();
function updateCamera(dt){
  // Sky events tilt the view up to show the sky; dragging hands control back to the player.
  if(cam.tPhi!=null&&!dragging){cam.phi=lerp(cam.phi,cam.tPhi,1-Math.pow(.4,dt)); if(cam.tPhi===1.12&&Math.abs(cam.phi-1.12)<.005) cam.tPhi=null;}
  cam.dist=lerp(cam.dist,cam.tDist,1-Math.pow(.002,dt)); cam.look.lerp(cam.tLook,1-Math.pow(follow?.0005:.02,dt));
  const sp=Math.sin(cam.phi);
  camera.position.set(cam.look.x+cam.dist*sp*Math.sin(cam.theta),cam.look.y+cam.dist*Math.cos(cam.phi),cam.look.z+cam.dist*sp*Math.cos(cam.theta));
  // In close up, pull the camera in front of any trunk or leaves between it and the creature.
  if(follow&&treeGroup){camDir.subVectors(camera.position,cam.look); const d=camDir.length(); camDir.divideScalar(d); camRay.set(cam.look,camDir); camRay.far=d; const hit=camRay.intersectObject(treeGroup,true)[0]; if(hit) camera.position.copy(cam.look).addScaledVector(camDir,Math.max(.5,hit.distance-.25));}
  camera.lookAt(cam.look);
  const fg=Math.max(amtOf('fog'),amtOf('snow')*.35); scene.fog.near=lerp(cam.dist+8,cam.dist*.5,fg); scene.fog.far=lerp(cam.dist+55,cam.dist+16,fg);
  if(A().under){scene.fog.near=Math.min(scene.fog.near,cam.dist*.6); scene.fog.far=Math.min(scene.fog.far,cam.dist+30);}
}

/* ---------- Sky + weather ---------- */
const C_FOG=new THREE.Color(0xcfd8db),C_GOLD=new THREE.Color(0xffc56b),C_BLUEMOON=new THREE.Color(0x2a4a8a),C_AURORA=new THREE.Color(0x1f4a4a);
const C_DAY=new THREE.Color(0x9ad3e6),C_DUSK=new THREE.Color(0xf0a882),C_NIGHT=new THREE.Color(0x182246),C_RAIN=new THREE.Color(0x7b8a95),sky=new THREE.Color();
const SUN_DAY=new THREE.Color(0xfff1d6),SUN_LOW=new THREE.Color(0xffb27a),SUN_GOLD=new THREE.Color(0xffbe55),SUN_SEA=new THREE.Color(0x8fe0ff),AMB=new THREE.Color(0x5f6fb8),AMB_MOON=new THREE.Color(0x8fb4ff);
function updateSky(){
  const dt=(state.time%DAY)/DAY, s=Math.sin(dt*TAU)+.2, light=clamp(s*2.2+.15,0,1);
  state.light=light; state.night=1-light; state.dayT=dt;
  if(light<.5) sky.copy(C_NIGHT).lerp(C_DUSK,light*2); else sky.copy(C_DUSK).lerp(C_DAY,(light-.5)*2);
  const ra=amtOf('rain'), sn=amtOf('snow'), fg=amtOf('fog'), gd=amtOf('golden'), bm=amtOf('bluemoon'), au=amtOf('aurora');
  sky.lerp(C_RAIN,ra*.45*light); sky.lerp(C_FOG,Math.max(fg*.7,sn*.35)*light); sky.lerp(C_GOLD,gd*.55); sky.lerp(C_BLUEMOON,bm*.5*state.night); sky.lerp(C_AURORA,au*.3*state.night);
  scene.background.copy(sky); scene.fog.color.copy(sky);
  const ang=dt*TAU;
  sun.position.set(Math.cos(ang)*22,Math.max(.15,Math.sin(ang)+.25)*26+4,10);
  sun.intensity=((.05+light*.85)*(1-(ra+sn+fg*.6)*.3)+gd*.25)*(A().dim||1);
  sun.color.copy(SUN_LOW).lerp(SUN_DAY,clamp((light-.4)*2,0,1)).lerp(SUN_GOLD,gd); if(A().under) sun.color.lerp(SUN_SEA,.55);
  hemi.intensity=(.22+light*.45)*(A().dim||1); amb.intensity=.38*(1-light)+.05+bm*.2; amb.color.copy(AMB).lerp(AMB_MOON,bm);
  groundMat.color.copy(GROUND).lerp(SNOWG,sn*.4); clearMat.color.copy(CLEAR).lerp(SNOWG,sn*.6);
  starMat.opacity=A().under?0:Math.pow(state.night,2)*(1-(ra+sn+fg)*.8); ffMat.opacity=Math.max(state.night*(1-(ra+sn)*.6),amtOf('fireflies'));
}
function updateFireflies(t){
  if(ffMat.opacity<.01) return;
  ffSeed.forEach((f,i)=>{const a=f.a+t*f.s*.2; ffPos[i*3]=Math.cos(a)*f.r+Math.sin(t*f.s+f.o)*.6; ffPos[i*3+1]=f.y+Math.sin(t*f.s*1.7+f.o)*.4; ffPos[i*3+2]=Math.sin(a)*f.r+Math.cos(t*f.s+f.o)*.6;});
  ffGeo.attributes.position.needsUpdate=true;
}

/* ---------- Visitors ---------- */
// Weather visitors: each one turns up partway through its event and leaves when the event ends.
const EV_VIS={snow:'snowhare',rainbow:'rainbowfawn',aurora:'auroramoth'};
let evVisitor=null;
function updateEventVisitor(dt){
  const cur=weather.cur, vid=cur&&!cur.ending&&EV_VIS[cur.id];
  if(vid&&!evVisitor&&!cur.visited){
    if(cur.visT==null) cur.visT=rand(4,12); cur.visT-=dt;
    if(cur.visT<=0&&creatures.length<MAX_CREATURES){const sp=SPECIES[vid]; cur.visited=true; evVisitor=createCreature(vid,{visitor:true});
      log(`A ${sp.name} wandered in with the ${EVENTS[cur.id].name.toLowerCase()}. Tap it to say hello.`); toast(`✦ A ${sp.name} appeared!`); burst(evVisitor.mesh.position.clone().add(new V(0,.5,0)),0xc6b4ff,10);}
  }
  if(evVisitor&&evVisitor.visitor&&!evVisitor.leaving&&EV_VIS[cur&&!cur.ending?cur.id:'']!==evVisitor.sp.id){evVisitor.leaving=true; log(`The ${evVisitor.sp.name} slipped back into the forest.`); startActivity(evVisitor);}
}
function updateVisitor(dt){

    if(visitorCD<=0){visitorCD=rand(15,30); if((evOn('starfall')||state.night>.7&&Math.random()<.5)&&state.stage>=1&&creatures.length<MAX_CREATURES){visitor=createCreature('starfox',{visitor:true}); log(`A Starlit Fox is peeking in from the forest. Tap it to say hello.`); toast('✦ A rare visitor has appeared!'); burst(visitor.mesh.position.clone().add(new V(0,.5,0)),0xc6b4ff,10);}}
  } else if(visitor.visitor&&!visitor.leaving&&state.night<.3){visitor.leaving=true; log('The Starlit Fox slipped back into the forest.'); startActivity(visitor);}

/* ---------- Economy ---------- */
const storedOf=id=>Object.values(state.areas).reduce((n,a)=>n+a.creatures.filter(c=>c.s===id).length,0);

const totalRate=()=>creatures.reduce((s,c)=>s+cRate(c),0)+Object.values(state.areas).reduce((s,a)=>s+(a.rate||0),0);

function buyCreature(id){

  burst(c.mesh.position.clone().add(new V(0,.5,0)),tier==='legend'?0xf5cc6e:tier==='rare'?0xc6b4ff:sp.mystic?0xc6b4ff:0xf5cc6e,tier==='legend'?28:tier==='rare'?18:10);

  else if(tier==='rare'){chord([587.33,739.99,880,1174.66]); toast(`✦ Rare coat! ${c.name} the ${sp.name} is ${tn.name}!`);}

  log(`${c.name} the ${sp.name} arrived${tier!=='natural'?` with a ${tn.name.toLowerCase()} coat`:''}. They seem ${c.pers.toLowerCase()}.`);

}
function startPlacing(type){

  d.g.traverse(o=>{if(o.isMesh){o.material=ghostMat; o.castShadow=false;}});
  const ring=new THREE.Mesh(new THREE.RingGeometry(DECOR[type].fp+.1,DECOR[type].fp+.28,20),new THREE.MeshBasicMaterial({color:0x93d39d,transparent:true,opacity:.8,side:THREE.DoubleSide}));

}
function updateGhost(pt){

ring.rotation.x=-Math.PI/2; ring.visible=false; scene.add(ring);
function select(c,doFollow){

/* ---------- Map + travel ---------- */
function renderMap(){
  return `<div class="ph"><h2>Map</h2><p>Travel between places. Creatures everywhere keep earning while you're away.</p></div><div class="list">${AREA_ORDER.map(id=>{
    const D=AREAS[id], here=id===curArea, open=!!state.unlocked[id], locked=!open&&state.stage<D.stage;
    const n=here?creatures.filter(c=>!c.visitor).length:(state.areas[id]?state.areas[id].creatures.length:0);
    const sub=open?`${D.desc} ${n} friend${n===1?' lives':'s live'} here.`:locked?`${D.desc} Grow to ${STAGES[D.stage].name} to unlock.`:`${D.desc}${D.native?` Home of the ${SPECIES[D.native].name}.`:''}`;
    const btn=here?'<span class="lock">YOU ARE HERE</span>':open?`<button class="btn" data-travel="${id}">Travel</button>`:locked?'<span class="lock">LOCKED</span>':`<button class="btn gold buy" data-unlock="${id}" data-cost="${D.cost}">${fmt(D.cost)} ✦</button>`;
    return `<div class="item${locked?' locked':''}"><span class="sw" style="--a:${hex(D.clear)};--b:${hex(D.sky)}"></span><div class="it-main"><div class="it-name">${D.name}</div><div class="it-sub two">${sub}</div></div>${btn}</div>`;}).join('')}</div>`;
}
const serCreatures=()=>creatures.filter(c=>!c.visitor).map(c=>({s:c.sp.id,n:c.name,p:c.pers,h:Math.round(c.happy),t:c.tint.tier!=='natural'?c.tint.id:undefined,x:+c.mesh.position.x.toFixed(2),z:+c.mesh.position.z.toFixed(2)}));
const serDecor=()=>decor.map(d=>({t:d.type,x:+d.pos.x.toFixed(2),z:+d.pos.z.toFixed(2),r:+d.rot.toFixed(2)}));
function fillArea(data){
  if(data&&Array.isArray(data.decor)) data.decor.forEach(d=>{if(DECOR[d.t]) addDecor(d.t,+d.x||3,+d.z||3,d.r);});
  if(data&&Array.isArray(data.creatures)) data.creatures.forEach(c=>{if(SPECIES[c.s]) createCreature(c.s,{name:c.n,pers:c.p,happy:c.h,tint:c.t,x:c.x,z:c.z});});
}
function travel(id,first){
  if(id===curArea||!state.unlocked[id]) return;
  const fade=$('#fade'); fade.classList.add('on'); closePanel();
  setTimeout(()=>{
    state.areas[curArea]={creatures:serCreatures(),decor:serDecor(),rate:creatures.reduce((s,c)=>s+cRate(c),0)};
    cancelPlacing(); if(selected) deselect(); follow=null;
    creatures.slice().forEach(removeCreature); decor.forEach(d=>scene.remove(d.g)); decor.length=0; assignLights();
    visitor=null; evVisitor=null; weather.cur=null; weather.amt=0; weather.next=null; weather.cd=rand(20,40); cam.tPhi=null;
    curArea=id; discover('pl',id); buildArea(id); buildTree(state.stage);
    const data=state.areas[id]; delete state.areas[id]; fillArea(data);
    if(first&&AREAS[id].native){const c=createCreature(AREAS[id].native,{x:rand(-3,3),z:rand(5,8)}); setTimeout(()=>toast(`${c.name} the ${c.sp.name} came to say hello!`),900); burst(c.mesh.position.clone().add(new V(0,.5,0)),0xf5cc6e,12);}
    camDefaults(); cam.dist=cam.tDist+6; cam.look.copy(cam.tLook);
    log(`You arrived at ${AREAS[id].name}.`); toast(`Welcome to ${AREAS[id].name}`); chord([392,523.25,659.25]);
    save(); requestAnimationFrame(()=>fade.classList.remove('on'));
  },380);
}
function unlockArea(id){
  const D=AREAS[id]; if(state.unlocked[id]||state.essence<D.cost||state.stage<D.stage) return;
  state.essence-=D.cost; state.unlocked[id]=true; travel(id,true);
}

/* ---------- Journal ---------- */
// Records every species, coat and weather event the player has seen. Undiscovered ones show as ???.
const JOURNAL_SP=[...SHOP,'goat','duck','snail','crab','seaturtle','skyray','starfox','snowhare','rainbowfawn','auroramoth'], JOURNAL_PL=AREA_ORDER, JOURNAL_CO=Object.keys(TINTS).filter(k=>k!=='natural'), JOURNAL_EV=Object.keys(EVENTS);
const JOURNAL_NAMES={pl:id=>AREAS[id].name,sp:id=>SPECIES[id].name,co:id=>TINTS[id].name+' coat',ev:id=>EVENTS[id].name};
function discover(kind,id,val){
  const J=state.journal[kind]; if(J[id]) return; J[id]=val||1;
  if(loading) return;
  $('#jDot').hidden=false; log(`📖 Added to your journal: ${JOURNAL_NAMES[kind](id)}.`);
  if(openTab==='journal') refreshPanel();
}
const livesAt=id=>{const a=AREA_ORDER.find(a=>(AREAS[a].shop||SHOP).includes(id)); return a?AREAS[a].name:'';};
function coatSwatch(t){
  if(t.live==='prism') return 'linear-gradient(135deg,#ff8a8a,#ffe08a,#8affc1,#8ac8ff,#d08aff)';
  const cs=[0x8a5a3a,0xc98f5a,0xf0dcc0].map(h=>hex(tintColor(t,h)));
  return `linear-gradient(135deg,${cs[0]},${cs[1]} 55%,${cs[2]})`;
}
function jSection(title,ids,kind,cell){
  const found=ids.filter(id=>state.journal[kind][id]).length;
  return `<div class="jsec"><h3>${title}<small>${found} / ${ids.length}</small></h3><div class="jgrid">${ids.map(id=>cell(id,!!state.journal[kind][id])).join('')}</div></div>`;
}
function renderJournal(){
  const J=state.journal, total=JOURNAL_PL.length+JOURNAL_SP.length+JOURNAL_CO.length+JOURNAL_EV.length;
  const got=JOURNAL_PL.filter(i=>J.pl[i]).length+JOURNAL_SP.filter(i=>J.sp[i]).length+JOURNAL_CO.filter(i=>J.co[i]).length+JOURNAL_EV.filter(i=>J.ev[i]).length;
  const lock='<span class="jicon">?</span>';
  return `<div class="ph"><h2>Journal</h2><p>Everything you've discovered in the grove. ${got} of ${total} found.</p></div><div class="jprog"><i style="width:${got/total*100}%"></i></div>`
  +jSection('Creatures',JOURNAL_SP,'sp',(id,ok)=>{const sp=SPECIES[id];
    return ok?`<div class="jc"><span class="sw" style="--a:${hex(sp.a)};--b:${hex(sp.b)}"></span><div class="it-main"><div class="it-name">${sp.name}</div><div class="it-sub">${sp.visitorOnly?'Rare visitor':layerName(sp)}</div></div></div>`
      :`<div class="jc locked">${lock}<div class="it-main"><div class="it-name">???</div><div class="it-sub">${sp.visitorOnly&&!livesAt(id)?sp.hint:!areaShop().includes(id)&&livesAt(id)?'Lives at '+livesAt(id):state.stage<sp.stage?'Grow to '+STAGES[sp.stage].name:'Not invited yet'}</div></div></div>`;})
  +jSection('Coats',JOURNAL_CO,'co',(id,ok)=>{const t=TINTS[id];
    return ok?`<div class="jc"><span class="sw" style="background:${coatSwatch(t)}"></span><div class="it-main"><div class="it-name">${t.name} ${tierChip(t)}</div><div class="it-sub">First seen on a ${String(J.co[id]).toLowerCase()}</div></div></div>`
      :`<div class="jc locked">${lock}<div class="it-main"><div class="it-name">??? <span class="tchip t-${t.tier}">${TIERS[t.tier].name.toUpperCase()}</span></div><div class="it-sub">Not found yet</div></div></div>`;})
  +jSection('Places',JOURNAL_PL,'pl',(id,ok)=>{const D=AREAS[id];
    return ok?`<div class="jc"><span class="sw" style="--a:${hex(D.clear)};--b:${hex(D.sky)}"></span><div class="it-main"><div class="it-name">${D.name}</div><div class="it-sub">${D.desc}</div></div></div>`
      :`<div class="jc locked">${lock}<div class="it-main"><div class="it-name">???</div><div class="it-sub">Unlock it on the map</div></div></div>`;})
  +jSection('Weather',JOURNAL_EV,'ev',(id,ok)=>{const E=EVENTS[id], chip=`<span class="tchip t-${E.tier}">${E.tier==='legend'?'VERY RARE':E.tier.toUpperCase()}</span>`;
    return ok?`<div class="jc"><span class="jicon">${E.label.split(' ')[0]}</span><div class="it-main"><div class="it-name">${E.name} ${chip}</div><div class="it-sub" title="${E.start}">${E.start}</div></div></div>`
      :`<div class="jc locked">${lock}<div class="it-main"><div class="it-name">??? ${chip}</div><div class="it-sub">${E.when==='night'?'Happens at night':E.when==='day'?'Happens by day':'Any time'}</div></div></div>`;});
}
function openPanel(tab){if(tab==='journal') $('#jDot').hidden=true; openTab=tab; $('#panel').hidden=false; document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab))); $('#panelBody').innerHTML=renderPanel(tab); updateAfford(); if(innerWidth<=640&&selected) deselect();}
function closePanel(){openTab=null; $('#panel').hidden=true; document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected','false'));}
function refreshPanel(){if(!openTab) return; const pb=$('#panel'), st=pb.scrollTop; $('#panelBody').innerHTML=renderPanel(openTab); pb.scrollTop=st; updateAfford();}
function updateAfford(){document.querySelectorAll('#panelBody [data-cost]').forEach(b=>{b.disabled=state.essence<+b.dataset.cost;});}
function updateFriendsLive(){if(openTab!=='friends') return; creatures.forEach(c=>{const a=document.querySelector(`[data-act="${c.uid}"]`), m=document.querySelector(`[data-mood="${c.uid}"]`); if(a&&c.act) a.textContent=c.act.label; if(m) m.style.width=c.happy+'%';});}

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{ensureAudio(); openTab===b.dataset.tab?closePanel():openPanel(b.dataset.tab);}));
$('#panelBody').addEventListener('click',e=>{
  const t=e.target.closest('[data-buy],[data-decor],[data-grow],[data-friend],[data-travel],[data-unlock]'); if(!t) return; ensureAudio();
  if(t.dataset.buy) buyCreature(t.dataset.buy);
  else if(t.dataset.decor) startPlacing(t.dataset.decor);
  else if(t.dataset.grow) growTree();
  else if(t.dataset.travel) travel(t.dataset.travel);
  else if(t.dataset.unlock) unlockArea(t.dataset.unlock);

});
$('#mBtn').addEventListener('click',()=>{ensureAudio(); openTab==='map'?closePanel():openPanel('map');});
$('#jBtn').addEventListener('click',()=>{ensureAudio(); openTab==='journal'?closePanel():openPanel('journal');});
$('#cClose').addEventListener('click',deselect);
$('#cPet').addEventListener('click',pet);
$('#cTreat').addEventListener('click',treat);
$('#cFriend').addEventListener('click',befriend);
$('#cWatch').addEventListener('click',()=>{if(!selected) return; follow===selected?unwatch():watch(selected,true);});
$('#placeCancel').addEventListener('click',cancelPlacing);
$('#snd').addEventListener('click',()=>{state.sound=!state.sound; $('#snd').textContent=state.sound?'♪ On':'♪ Off'; ensureAudio(); save();});

/* ---------- Log + toast ---------- */
const logLines=[];
function log(text){logLines.push({text,t:performance.now()}); if(logLines.length>3) logLines.shift(); renderLog();}
function renderLog(){const now=performance.now(); $('#log').innerHTML=logLines.map((l,i)=>`<div style="opacity:${Math.max(0,Math.min(1,(14000-(now-l.t))/3000))*(i===logLines.length-1?1:.7)}">${l.text}</div>`).join('');}
let toastTimer=0;
function toast(text){const t=$('#toast'); t.textContent=text; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,2800);}

/* ---------- Sound ---------- */
let actx=null; const PENTA=[523.25,587.33,659.25,783.99,880,1046.5];
function ensureAudio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;}} if(actx&&actx.state==='suspended') actx.resume().catch(()=>{});}
function tone(f,d,v,delay){if(!state.sound||!actx) return; try{const t0=actx.currentTime+(delay||0), o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+d); o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+d+.05);}catch(e){}}
function chord(fs){fs.forEach((f,i)=>tone(f,.5,.04,i*.07));}

/* ---------- Input ---------- */
const raycaster=new THREE.Raycaster(), ndc=new THREE.Vector2(), groundPlane=new THREE.Plane(new V(0,1,0),0);
const pointers=new Map(); let downPos=null, dragging=false, pinchD=0, lastInteract=0;
function setRay(x,y){const r=canvas.getBoundingClientRect(); ndc.set((x-r.left)/r.width*2-1,-((y-r.top)/r.height)*2+1); raycaster.setFromCamera(ndc,camera);}
function groundAt(x,y){setRay(x,y); const p=new V(); return raycaster.ray.intersectPlane(groundPlane,p)?p:null;}
function pDist(){const a=[...pointers.values()]; return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;}
canvas.addEventListener('pointerdown',e=>{
  ensureAudio(); try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); lastInteract=performance.now();
  if(pointers.size===1){downPos={x:e.clientX,y:e.clientY}; dragging=false;} else {dragging=true; pinchD=pDist();}
});
canvas.addEventListener('pointermove',e=>{
  if(placing&&e.pointerType==='mouse') updateGhost(groundAt(e.clientX,e.clientY));
  if(!pointers.has(e.pointerId)) return;
  const prev=pointers.get(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); lastInteract=performance.now();
  if(pointers.size>=2){const d=pDist(), lim=camLimits(); cam.tDist=clamp(cam.tDist*pinchD/d,lim[0],lim[1]); pinchD=d; return;}
  if(!dragging&&downPos&&Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>6) dragging=true;
  if(dragging){cam.tPhi=null; cam.theta-=(e.clientX-prev.x)*.008; cam.phi=clamp(cam.phi-(e.clientY-prev.y)*.006,.5,1.45);}
});
function endPointer(e,cancel){
  const had=pointers.has(e.pointerId); pointers.delete(e.pointerId);
  if(!cancel&&had&&!dragging&&downPos&&pointers.size===0) handleTap(e.clientX,e.clientY);
  if(pointers.size===0){downPos=null; setTimeout(()=>{dragging=false;},0);}
}
canvas.addEventListener('pointerup',e=>endPointer(e,false));
canvas.addEventListener('pointercancel',e=>endPointer(e,true));
canvas.addEventListener('wheel',e=>{e.preventDefault(); const lim=camLimits(); cam.tDist=clamp(cam.tDist*(1+Math.sign(e.deltaY)*.1),lim[0],lim[1]); lastInteract=performance.now();},{passive:false});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(placing) cancelPlacing(); else if(selected) deselect(); else closePanel();}});

function handleTap(x,y){
  if(placing){const pt=groundAt(x,y); if(pt) tryPlace(pt); return;}
  if(catchMeteor(x,y)) return;
  setRay(x,y);
  const ch=raycaster.intersectObjects(creatures.map(c=>c.mesh),true);
  for(const h of ch){let o=h.object; while(o){if(o.userData.creature){select(o.userData.creature,false); return;} o=o.parent;}}
  if(treeGroup){const th=raycaster.intersectObject(treeGroup,true); if(th.length){tapTree(th[0].point,x,y); return;}}
  if(selected) deselect();
}

/* ---------- Save / load ---------- */
function serialize(){
  return {v:1,essence:state.essence,stage:state.stage,time:state.time,taps:state.taps,total:state.total,sound:state.sound,
    creatures:serCreatures(),decor:serDecor(),area:curArea,unlocked:state.unlocked,areas:state.areas,j:state.journal,saved:Date.now()};
}
function save(){try{localStorage.setItem(STORE,JSON.stringify(serialize()));}catch(e){}}
function readStore(){try{const s=localStorage.getItem(STORE); return s?JSON.parse(s):null;}catch(e){return null;}}
function load(data){
  const ok=data&&data.v===1;
  state.essence=ok&&isFinite(data.essence)?data.essence:25;
  state.stage=ok?clamp(data.stage|0,0,STAGES.length-1):0;
  state.time=ok&&isFinite(data.time)?data.time:DAY*.03;
  state.taps=ok?data.taps|0:0; state.total=ok&&isFinite(data.total)?data.total:0;
  state.sound=ok&&data.sound===false?false:true; $('#snd').textContent=state.sound?'♪ On':'♪ Off';
  const j=ok&&data.j||{}; state.journal={sp:Object.assign({},j.sp),co:Object.assign({},j.co),ev:Object.assign({},j.ev),pl:Object.assign({grove:1},j.pl)};
  state.unlocked=Object.assign({grove:true},ok&&data.unlocked); state.areas={};
  if(ok&&data.areas) Object.keys(data.areas).forEach(k=>{const a=data.areas[k]; if(AREAS[k]&&a&&Array.isArray(a.creatures)) state.areas[k]={creatures:a.creatures,decor:Array.isArray(a.decor)?a.decor:[],rate:+a.rate||0};});
  curArea=ok&&AREAS[data.area]&&state.unlocked[data.area]?data.area:'grove'; delete state.areas[curArea];
  loading=true;
  buildArea(curArea); buildTree(state.stage);
  if(ok) fillArea(data);
  else {addDecor('lantern',3.2,2.2); addDecor('flowers',-3,1.8); createCreature('rabbit',{name:'Clover',pers:'Lazy',happy:75,x:2.5,z:-2.5});}
  loading=false;
  if(state.taps>=5) $('#hint').hidden=true;
  camDefaults(); cam.dist=cam.tDist+6; cam.look.copy(cam.tLook);
  if(ok&&data.saved){const away=Math.min((Date.now()-data.saved)/1000,8*3600); const earned=totalRate()*away*.5; if(away>60&&earned>=1){state.essence+=earned; state.total+=earned; setTimeout(()=>toast(`While you were away, your grove gathered ${fmt(earned)} essence.`),600);}}
  setTimeout(()=>log(ok?`Welcome back to ${AREAS[curArea].name}.`:'A little sapling sways in a quiet clearing. Clover the rabbit is already dozing nearby.'),300);
}

/* ---------- Bubbles ---------- */
const proj=new V();
function updateBubbles(dt){
  const w=canvas.clientWidth, h=canvas.clientHeight;
  creatures.forEach(c=>{
    if(c.bubbleT>0){
      c.bubbleT-=dt; proj.copy(c.mesh.position); proj.y+=c.height+c.mesh.userData.parts.g.position.y; proj.project(camera);
      if(proj.z>1||c.bubbleT<=0){c.bubbleEl.hidden=true; return;}
      c.bubbleEl.hidden=false; c.bubbleEl.style.transform=`translate(${((proj.x+1)/2*w).toFixed(1)}px,${((1-proj.y)/2*h-8).toFixed(1)}px) translate(-50%,-100%)`;
    } else if(!c.bubbleEl.hidden) c.bubbleEl.hidden=true;
  });
}

/* ---------- Loop ---------- */
let PX=3;
function resize(){const w=innerWidth,h=innerHeight; PX=Math.max(2,Math.round(Math.min(w,h)/280)); renderer.setPixelRatio(1); renderer.setSize(Math.ceil(w/PX),Math.ceil(h/PX),false); camera.aspect=w/h; camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=performance.now(), hudT=0, saveT=0, noteT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000); last=now; const t=now/1000;
  state.time+=dt; updateSky(); updateWeather(dt,t); updateVisitor(dt);
  const rate=totalRate(); state.essence+=rate*dt; state.total+=rate*dt;
  for(let i=creatures.length-1;i>=0;i--) if(creatures[i]) updateCreature(creatures[i],dt,t);
  // decor life
  lightPool.forEach(l=>{const d=l.userData.d; if(!d){l.intensity=0; return;} l.intensity=d.type==='campfire'?(.4+state.night)*d.light.k*(.85+.15*Math.sin(t*13)+.08*Math.sin(t*29)):d.type==='crystal'?(.3+state.night)*d.light.k*(.8+.2*Math.sin(t*1.6)):state.night*d.light.k;});
  noteT-=dt;
  decor.forEach(d=>{
    d.flames.forEach((f,i)=>{f.scale.y=(.26-.08*i)*1.4*(.8+.35*Math.abs(Math.sin(t*(9+i*3)+i)));});
    d.caps.forEach((c,i)=>{const k=1+Math.sin(t*2+i)*.08*(.3+state.night); c.scale.set(.26*k,.1,.26*k);});
    if(d.notes&&noteT<=0&&Math.random()<.25) burst(d.pos.clone().add(new V(0,1.1,0)),0xc6b4ff,1,.3);
    const wind=amtOf('wind');
    if(d.seat){const busy=creatures.some(c=>c.mode==='do'&&c.act&&c.act.decor===d&&c.act.type==='swing'); d.amp=lerp(d.amp||0,busy?.38:.05+wind*.15,dt*1.5); d.swingA=Math.sin(t*1.9+d.pos.x)*d.amp; d.seat.rotation.x=d.swingA;}
    if(d.chimes){d.chimes.forEach((C,i)=>{C.rotation.z=Math.sin(t*(2.4+i*.3)+i)*(.06+wind*.3); C.rotation.x=Math.cos(t*2+i)*(.04+wind*.2);});
      d.chimeT-=dt; if(d.chimeT<=0){d.chimeT=wind>.3?rand(.4,1.4):rand(5,12); tone(pick(PENTA)*2,1.4,.012+wind*.018);}}
    if(d.steam) d.steam.forEach(m=>{const f=(t*.35+m.userData.o)%1, s=.08+f*.16; m.position.set(m.userData.x+Math.sin(t+m.userData.o*6)*.1,.15+f*1.3,m.userData.z); m.scale.set(s,s*.7,s);});
    if(d.crystals) d.crystals.forEach((m,i)=>{const k=1+Math.sin(t*1.6+i)*.04; m.scale.x=.18*k; m.scale.z=.18*k;});
  });
  if(noteT<=0) noteT=.6;
  treeInfo.twinkle.forEach((m,i)=>m.scale.setScalar(.7+.4*Math.abs(Math.sin(t*1.5+i))));
  if(treeGroup){treeBounce=Math.max(0,treeBounce-dt*3); const k=Math.sin((1-treeBounce)*Math.PI*3)*treeBounce*.05; treeGroup.scale.set(1-k*.5,1+k,1-k*.5); treeGroup.rotation.z=Math.sin(t*.6)*.006+Math.sin(t*1.7)*.02*amtOf('wind');}
  updateParts(dt); updateFireflies(t); areaAnim.forEach(f=>f(t,dt));
  if(selected){ring.position.set(selected.mesh.position.x,selected.sp.kind==='fly'?selected.mesh.position.y-.3:.03,selected.mesh.position.z); ring.rotation.z+=dt;}
  if(follow){const fp=follow.mesh.position; cam.tLook.set(fp.x,fp.y+follow.height*.45+follow.mesh.userData.parts.g.position.y,fp.z);}
  if(!dragging&&!reduceMotion&&now-lastInteract>(follow?6000:9000)) cam.theta+=dt*(follow?.1:.025);
  updateCamera(dt); renderer.render(scene,camera); updateBubbles(dt);
  hudT-=dt;
  if(hudT<=0){hudT=.25;
    $('#ess').textContent=fmt(state.essence); $('#rate').textContent=`+${fmtR(rate)}/S · ${STAGES[state.stage].name.toUpperCase()}`;
    $('#clock').textContent=clockLabel(); updateAfford(); if(selected) renderCard(); updateFriendsLive(); renderLog();
  }
  saveT-=dt; if(saveT<=0){saveT=5; save();}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden) save();});
window.addEventListener('pagehide',save);
