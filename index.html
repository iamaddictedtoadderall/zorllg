<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Worldroot Grove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: full-bleed pixelated 3D grove; HUD floats top, creature card at right, tabbed dock anchored bottom */
:root{
  --night:#0e1814;
  --panel:rgba(22,38,29,.92);
  --panel-2:#22392b;
  --edge:#3f5e48;
  --shade:#08100c;
  --ink:#eef2df;
  --muted:#a6b8a0;
  --gold:#f5cc6e;
  --gold-ink:#3a2a08;
  --lilac:#c6b4ff;
  --leaf:#93d39d;
  --rose:#f29b9b;
  --bubble:#f6f3e4;
  --bubble-ink:#1d2b21;
  --f-ui:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  --f-tag:"Silkscreen", "Pixelify Sans", ui-monospace, monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--f-ui);overflow:hidden;font-size:15px;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block;cursor:grab}
#c.placing{cursor:crosshair}
#bubbles,#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.panel{background:var(--panel);border:2px solid var(--edge);box-shadow:0 3px 0 var(--shade)}
.hud{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.hud > *{pointer-events:auto}
.essence{display:flex;gap:10px;align-items:center;padding:8px 14px 8px 10px}
.gem{width:18px;height:18px;background:var(--gold);transform:rotate(45deg);box-shadow:inset -4px -4px 0 #c99a3a, inset 3px 3px 0 #fff2c4;border:2px solid var(--gold-ink);flex:none;margin:0 4px}
.ess-num{font-size:24px;font-weight:700;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.ess-rate{font-family:var(--f-tag);font-size:10px;color:var(--muted);letter-spacing:.04em;margin-top:3px}
.hud-right{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{padding:7px 12px;font-size:14px;white-space:nowrap}
.btn-ghost{cursor:pointer}
.btn-ghost:hover{background:var(--panel-2)}

.log{position:absolute;left:12px;top:calc(76px + env(safe-area-inset-top,0px));display:grid;gap:4px;max-width:min(360px,calc(100% - 24px));pointer-events:none}
.log div{font-size:13px;color:var(--ink);text-shadow:0 2px 0 var(--shade),0 0 6px rgba(0,0,0,.6);transition:opacity .6s}

.hint{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 14px;font-size:14px;color:var(--gold);pointer-events:none;animation:nudge 1.6s ease-in-out infinite;white-space:nowrap}
@keyframes nudge{50%{transform:translate(-50%,-5px)}}

.toast{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:9px 16px;font-size:15px;max-width:calc(100% - 32px);text-align:center;background:var(--panel-2);border:2px solid var(--gold);box-shadow:0 3px 0 var(--shade);pointer-events:none}

/* Creature card */
.card{position:absolute;right:12px;top:calc(68px + env(safe-area-inset-top,0px));width:270px;padding:12px;display:grid;gap:9px}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.c-name{font-size:22px;font-weight:700;line-height:1.05;text-wrap:balance}
.c-sub{color:var(--muted);font-size:13px;margin-top:3px}
.x{background:none;border:2px solid var(--edge);width:30px;height:30px;cursor:pointer;line-height:1;font-size:18px;flex:none}
.x:hover{background:var(--panel-2)}
.tag{font-family:var(--f-tag);font-size:10px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;min-width:46px;display:inline-block}
.c-row{display:flex;gap:8px;font-size:14px;align-items:baseline}
.c-row span:last-child{min-width:0}
.mood{display:flex;gap:8px;align-items:center;font-size:13px}
.bar{flex:1;height:10px;background:var(--shade);border:2px solid var(--edge);position:relative;min-width:0}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--rose);display:block}
.c-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel-2);border:2px solid var(--edge);box-shadow:0 2px 0 var(--shade);padding:6px 12px;cursor:pointer;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--leaf)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold-ink);font-weight:600}
.btn.lilac{background:var(--lilac);color:#241a48;border-color:#241a48;font-weight:600}

/* Dock */
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(580px,calc(100% - 24px));display:grid;gap:8px}
.dock-panel{max-height:min(46vh,430px);overflow:auto;padding:12px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{background:var(--panel);border:2px solid var(--edge);box-shadow:0 3px 0 var(--shade);padding:10px 4px;cursor:pointer;font-size:15px;font-weight:500}
.tab:hover{background:var(--panel-2)}
.tab[aria-selected="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold-ink)}
.ph h2{margin:0;font-size:18px;font-weight:700}
.ph p{margin:3px 0 10px;color:var(--muted);font-size:13px;max-width:60ch}
.list{display:grid;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:7px 8px;background:rgba(0,0,0,.18);border:2px solid transparent}
.item.locked{opacity:.5}
.item.clickable{cursor:pointer}
.item.clickable:hover{border-color:var(--edge)}
.sw{width:26px;height:26px;flex:none;border:2px solid var(--shade);background:linear-gradient(135deg,var(--a) 0 55%,var(--b) 55% 100%);image-rendering:pixelated}
.it-main{flex:1;min-width:0}
.it-name{font-size:15px;font-weight:600}
.it-sub{font-size:12px;color:var(--muted);margin-top:1px}
.chip{font-family:var(--f-tag);font-size:9px;letter-spacing:.05em;color:#241a48;background:var(--lilac);padding:1px 4px;vertical-align:2px;margin-left:4px}
.lock{font-family:var(--f-tag);font-size:10px;color:var(--muted)}
.buy{min-width:84px;font-variant-numeric:tabular-nums}
.foot{color:var(--muted);font-size:12px;margin:10px 0 0}
.mini-bar{width:54px;height:7px;background:var(--shade);border:1px solid var(--edge);position:relative;flex:none}
.mini-bar i{position:absolute;inset:0 auto 0 0;background:var(--rose)}
.stages{display:flex;gap:6px;margin:6px 0 12px}
.stages span{flex:1;height:10px;background:var(--shade);border:2px solid var(--edge)}
.stages span.on{background:var(--leaf)}
.tree-next{padding:10px;background:rgba(0,0,0,.18);display:grid;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.stats div{background:rgba(0,0,0,.18);padding:8px;text-align:center}
.stats b{display:block;font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums}
.stats small{font-family:var(--f-tag);font-size:9px;color:var(--muted);letter-spacing:.05em}

.placebar{position:absolute;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));display:flex;gap:12px;align-items:center;padding:8px 10px 8px 14px;max-width:calc(100% - 24px)}

/* Speech + emote bubbles */
.bubble{position:absolute;left:0;top:0;background:var(--bubble);color:var(--bubble-ink);border:2px solid var(--bubble-ink);padding:1px 6px 2px;font-size:14px;font-weight:600;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.35);will-change:transform}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:6px;height:6px;background:var(--bubble);border-right:2px solid var(--bubble-ink);border-bottom:2px solid var(--bubble-ink);transform:translateX(-50%) rotate(45deg)}
.bubble.talk{font-weight:500;font-size:13px}
.plus{position:absolute;color:var(--gold);font-weight:700;font-size:20px;text-shadow:0 2px 0 var(--gold-ink);animation:rise .9s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes rise{to{opacity:0;transform:translate(-50%,-180%)}}

@media (max-width:640px){
  .card{left:12px;right:12px;width:auto;top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .ess-num{font-size:20px}
  .tab{font-size:13px;padding:9px 2px}
  .log{top:calc(70px + env(safe-area-inset-top,0px))}
  .log div{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  .hint{animation:none}
  .plus{animation-duration:.01s}
}
</style>
</head>
<body>

<div id="app">
  <canvas id="c" aria-label="Your world tree grove. Tap the tree to gather essence."></canvas>
  <div id="bubbles"></div>
  <div id="fx"></div>

  <header class="hud">
    <div class="panel essence">
      <span class="gem" aria-hidden="true"></span>
      <div>
        <div id="ess" class="ess-num">0</div>
        <div id="rate" class="ess-rate">+0/S</div>
      </div>
    </div>
    <div class="hud-right">
      <div id="clock" class="panel pill">☀ Day</div>
      <button id="snd" class="panel pill btn-ghost" aria-label="Toggle sound">♪ On</button>
    </div>
  </header>

  <div id="log" class="log" aria-live="polite"></div>
  <div id="hint" class="panel hint">Tap the tree to gather essence</div>
  <div id="toast" class="toast" hidden></div>

  <div id="placebar" class="panel placebar" hidden>
    <span id="placeTxt">Tap the ground to place it</span>
    <button id="placeCancel" class="btn">Cancel</button>
  </div>

  <aside id="card" class="panel card" hidden>
    <div class="card-top">
      <div><div id="cName" class="c-name"></div><div id="cSub" class="c-sub"></div></div>
      <button id="cClose" class="x" aria-label="Close">×</button>
    </div>
    <div class="mood"><span class="tag">Mood</span><div class="bar"><i id="cMood"></i></div><span id="cMoodTxt"></span></div>
    <div class="c-row"><span class="tag">Now</span><span id="cAct"></span></div>
    <div class="c-row"><span class="tag">Loves</span><span id="cFav"></span></div>
    <div class="c-row"><span class="tag">Brings</span><span id="cRate"></span></div>
    <div class="c-btns">
      <button id="cPet" class="btn">Pet</button>
      <button id="cTreat" class="btn gold">Treat</button>
      <button id="cFriend" class="btn lilac" hidden>Befriend</button>
    </div>
  </aside>

  <nav id="dock" class="dock">
    <div id="panel" class="panel dock-panel" hidden><div id="panelBody"></div></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="creatures" aria-selected="false">Creatures</button>
      <button class="tab" role="tab" data-tab="decor" aria-selected="false">Decor</button>
      <button class="tab" role="tab" data-tab="friends" aria-selected="false">Friends</button>
      <button class="tab" role="tab" data-tab="tree" aria-selected="false">Tree</button>
    </div>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const V=THREE.Vector3, TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const $=s=>document.querySelector(s);
const hex=n=>'#'+n.toString(16).padStart(6,'0');
const fmt=n=>{n=Math.floor(n); if(n<1000) return String(n); if(n<1e6) return (n/1000).toFixed(n<1e4?1:0).replace(/\.0$/,'')+'k'; return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';};
const fmtR=n=>n<10?n.toFixed(1).replace(/\.0$/,''):fmt(n);
const STORE='worldroot-grove-v1', DAY=300, CLEAR_R=12.5, MAX_CREATURES=45;

/* ---------- Game data ---------- */
const STAGES=[
  {name:'Sapling',   h:2.2, r:0.18, cost:0,     tap:1,  unlock:''},
  {name:'Young Tree',h:4.0, r:0.38, cost:150,   tap:3,  unlock:'Roots spread wide. Deer, moles and mushroom folk move in.'},
  {name:'Grand Tree',h:6.5, r:0.62, cost:1200,  tap:8,  unlock:'Branches reach out. Squirrels, owls, badgers and glow moths arrive.'},
  {name:'Elder Tree',h:9.0, r:0.92, cost:6000,  tap:20, unlock:'The tree hums with old magic. Tiny dragons take notice.'},
  {name:'World Tree',h:12.5,r:1.25, cost:25000, tap:55, unlock:'A true World Tree. Phoenixes and sky whales circle the canopy.'}
];
const SPECIES={
  rabbit:{name:'Rabbit',shape:'quad',kind:'ground',cost:15,stage:0,rate:0.3,size:0.55,speed:1.6,a:0xd8c7ad,b:0xf6eee2,c:0xc9b294,ears:'long',tail:'puff',legH:0.12,hop:true},
  fox:{name:'Fox',shape:'quad',kind:'ground',cost:45,stage:0,rate:0.8,size:0.75,speed:1.9,a:0xe07a3a,b:0xf7eadb,c:0x3b2a22,ears:'pointy',tail:'bushy',legH:0.2},
  mosssprite:{name:'Moss Sprite',shape:'sprite',kind:'float',cost:110,stage:0,rate:1.6,size:0.8,speed:1.2,a:0xa8f592,b:0x4f9d55,mystic:true},
  deer:{name:'Deer',shape:'quad',kind:'ground',cost:260,stage:1,rate:3,size:1.0,speed:1.5,a:0xa9744a,b:0xf0dfc6,c:0x6b4a32,ears:'antler',tail:'puff',legH:0.3},
  mole:{name:'Mole',shape:'quad',kind:'roots',cost:200,stage:1,rate:2.5,size:0.55,speed:1.0,a:0x4f414b,b:0xf1a7a7,c:0x3a2f36,ears:'none',tail:'stub',legH:0.08},
  mushfolk:{name:'Mushroom Folk',shape:'mush',kind:'roots',cost:450,stage:1,rate:5,size:0.8,speed:0.9,a:0xd9524a,b:0xf3ead6,mystic:true},
  squirrel:{name:'Squirrel',shape:'quad',kind:'climb',cost:900,stage:2,rate:8,size:0.5,speed:2.2,a:0xb4643a,b:0xf3dcc0,c:0x7a3f22,ears:'pointy',tail:'squirrel',legH:0.1},
  badger:{name:'Badger',shape:'quad',kind:'roots',cost:1700,stage:2,rate:14,size:0.8,speed:1.1,a:0x5d5a5a,b:0xf2f0ea,c:0x2b2a2a,ears:'round',tail:'stub',legH:0.12,stripe:true},
  owl:{name:'Owl',shape:'bird',variant:'owl',kind:'fly',cost:1400,stage:2,rate:12,size:0.7,speed:2.4,a:0x8a6a4a,b:0xe9d6b6,c:0xf5c542,perch:true,nocturnal:true,yMin:.45,yMax:.95},
  glowmoth:{name:'Glow Moth',shape:'moth',kind:'fly',cost:2000,stage:2,rate:16,size:0.8,speed:1.6,a:0xe8f1ff,b:0x9fd8ff,mystic:true,nocturnal:true,yMin:.15,yMax:.8},
  dragon:{name:'Tiny Dragon',shape:'quad',kind:'fly',cost:6500,stage:3,rate:45,size:0.8,speed:2.8,a:0x5fb08a,b:0xe8d7a0,c:0x2f6b55,ears:'horns',tail:'dragon',legH:0.18,wings:true,mystic:true,perch:true,yMin:.3,yMax:1.0},
  phoenix:{name:'Phoenix',shape:'bird',variant:'phoenix',kind:'fly',cost:18000,stage:4,rate:110,size:1.0,speed:3.2,a:0xff8a3d,b:0xffd36a,c:0xff4f3a,mystic:true,perch:true,yMin:.75,yMax:1.3},
  skywhale:{name:'Sky Whale',shape:'whale',kind:'fly',cost:32000,stage:4,rate:180,size:1.6,speed:1.2,a:0x6f7fc9,b:0xd7defa,c:0xc6b4ff,mystic:true,yMin:1.12,yMax:1.45,big:true},
  starfox:{name:'Starlit Fox',shape:'quad',kind:'ground',cost:0,stage:1,rate:25,size:0.8,speed:2.0,a:0x34437f,b:0xd6e2ff,c:0x1f2850,ears:'pointy',tail:'star',legH:0.2,mystic:true,visitorOnly:true}
};
Object.keys(SPECIES).forEach(k=>SPECIES[k].id=k);
const SHOP=['rabbit','fox','mosssprite','mole','deer','mushfolk','squirrel','owl','badger','glowmoth','dragon','phoenix','skywhale'];

const DECOR={
  flowers:{name:'Flower Patch',cost:20,stage:0,fp:.6,desc:'Hungry creatures nibble, everyone sniffs.'},
  lantern:{name:'Lantern',cost:25,stage:0,fp:.4,desc:'Warm glow at night. Dreamers and moths adore it.'},
  berrybush:{name:'Berry Bush',cost:45,stage:0,fp:.7,desc:'A snack spot. Hungry creatures love it.'},
  bench:{name:'Bench',cost:70,stage:0,fp:.8,desc:'A cozy seat facing the tree. Grumpy ones approve.'},
  pond:{name:'Pond',cost:140,stage:0,fp:1.4,desc:'Splashing and drinking spot.'},
  mushring:{name:'Mushroom Ring',cost:260,stage:1,fp:1.1,desc:'Glows softly. Mystical creatures gather here.'},
  musicstone:{name:'Music Stone',cost:420,stage:1,fp:.6,desc:'Hums a tune. Playful creatures dance.'},
  campfire:{name:'Campfire',cost:700,stage:2,fp:.8,desc:'Everyone huddles here on cold nights.'}
};
const DECOR_ORDER=['flowers','lantern','berrybush','bench','pond','mushring','musicstone','campfire'];

const PERS={
  Lazy:{fav:['nap','sit'],loves:'long naps',w:{nap:3,wander:.5,sit:2},lines:['five more minutes...','is it nap time? it is now.','*big yawn*']},
  Shy:{fav:['hide'],loves:'quiet hiding spots',w:{hide:4,social:.4,play:.5},lines:['oh! h-hello.','i like it here. quietly.','...hi.']},
  Curious:{fav:['explore','wander'],loves:'exploring new things',w:{wander:2,explore:3},lines:["what's over there?",'ooh, shiny!','i wonder...']},
  Playful:{fav:['play','dance'],loves:'tag and dancing',w:{play:3,dance:2.5},lines:["tag! you're it!",'wheee!','again! again!']},
  Social:{fav:['social','warm'],loves:'chatting with friends',w:{social:3,warm:1.6},lines:['hey friend!','did you hear about the owl?','everyone come sit!']},
  Hungry:{fav:['eat'],loves:'berries and flowers',w:{eat:3.5},lines:['snack time.','berries. now.','can i eat that mushroom?']},
  Dreamy:{fav:['stargaze','bask'],loves:'stars and lantern light',w:{stargaze:3,bask:2.5,sit:1.5},lines:['the stars look soft tonight.','i dreamed i was a cloud.','~ ~ ~']},
  Grumpy:{fav:['sit'],loves:'a good bench',w:{sit:2.5,social:.4,play:.3},lines:['hmph.',"fine. it's nice here. whatever.","...don't look at me."]}
};
const PERS_KEYS=Object.keys(PERS);
const NAMES=['Clover','Pip','Bramble','Moss','Juniper','Fern','Acorn','Thistle','Hazel','Willow','Pebble','Sorrel','Tansy','Nutmeg','Bean','Maple','Wren','Basil','Poppy','Rowan','Sprout','Biscuit','Mallow','Tumble','Dewdrop','Cinder','Quill','Olive','Figgy','Lumen','Nova','Ember','Sage','Pudding','Button','Marigold','Truffle','Sable','Breeze','Puddle','Barley','Mochi','Toffee','Sundew','Kestrel','Wisp','Bumble','Cosmo'];

/* ---------- State ---------- */
const state={essence:25,stage:0,time:DAY*0.03,taps:0,total:0,night:0,light:1,sound:true};
const creatures=[], decor=[];
let uid=1, selected=null, follow=null, visitor=null, visitorCD=25, placing=null, openTab=null;

/* ---------- Three setup ---------- */
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'low-power'});
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.BasicShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.1,220);
scene.fog=new THREE.Fog(0x9ad3e6,30,80);
scene.background=new THREE.Color(0x9ad3e6);

const hemi=new THREE.HemisphereLight(0xe6f6ff,0x4a6b3a,0.6); scene.add(hemi);
const amb=new THREE.AmbientLight(0x5f6fb8,0.1); scene.add(amb);
const sun=new THREE.DirectionalLight(0xfff1d6,0.9);
sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:90});
sun.shadow.bias=-0.003; scene.add(sun); scene.add(sun.target);

const lightPool=[];
for(let i=0;i<8;i++){const l=new THREE.PointLight(0xffc870,0,6,2); l.position.set(0,-50,0); scene.add(l); lightPool.push(l);}

const matCache={};
function M(color,basic){const k=color+(basic?'b':'l'); return matCache[k]||(matCache[k]=basic?new THREE.MeshBasicMaterial({color}):new THREE.MeshLambertMaterial({color}));}
function PH(color){const k=color+'p'; return matCache[k]||(matCache[k]=new THREE.MeshPhongMaterial({color,flatShading:true,shininess:0}));}

/* ---------- Creature logic ---------- */
const minR=sp=>treeInfo.r*1.45+.3+sp.size*.25;

function hidePoint(sp){const a=cam.theta+Math.PI+rand(-.5,.5), r=minR(sp)+.1; return new V(Math.sin(a)*r,0,Math.cos(a)*r);}
function skyPoint(sp){const h=treeInfo.h, a=rand(0,TAU), r=sp.big?rand(8,13):rand(treeInfo.r+1.6,Math.min(11,3+h*.7)); return new V(Math.cos(a)*r,Math.max(1.2,rand(sp.yMin,sp.yMax)*h+.4),Math.sin(a)*r);}

function near(p,d){const a=rand(0,TAU); return new V(p.x+Math.cos(a)*d,0,p.z+Math.sin(a)*d);}
function decorSpot(d,spread,face){const a=rand(0,TAU),r=face?spread:spread*rand(.3,1); return {target:new V(d.pos.x+Math.cos(a)*r,0,d.pos.z+Math.sin(a)*r),faceTarget:face?d.pos.clone():null};}

function constrain(v,sp,leaving){
  const r=Math.hypot(v.x,v.z);
  if(sp.kind==='fly'){const mn=treeInfo.r+1; if(r<mn&&v.y<treeInfo.h*1.05){const k=mn/Math.max(r,.01); v.x*=k; v.z*=k;} return v;}
  if(sp.kind==='climb') {if(r>CLEAR_R&&!leaving){const k=CLEAR_R/r; v.x*=k; v.z*=k;} return v;}
  const mn=minR(sp);
  if(r<mn){const k=mn/Math.max(r,.01); v.x*=k; v.z*=k;}
  else if(r>CLEAR_R&&!leaving){const k=CLEAR_R/r; v.x*=k; v.z*=k;}
  return v;
}
function climbPath(from,to){
  const R=treeInfo.r*.92+.18, pts=[], af=Math.atan2(from.z,from.x), at=Math.atan2(to.z,to.x), up=to.y>.6, fromUp=from.y>.6;
  if(fromUp&&up){pts.push(new V(Math.cos(af)*R,from.y,Math.sin(af)*R)); pts.push(new V(Math.cos(at)*R,to.y,Math.sin(at)*R));}
  else if(fromUp){pts.push(new V(Math.cos(af)*R,from.y,Math.sin(af)*R)); pts.push(new V(Math.cos(af)*R,.05,Math.sin(af)*R)); pts.push(new V(Math.cos(af)*(R+.5),0,Math.sin(af)*(R+.5)));}
  else if(up){pts.push(new V(Math.cos(at)*(R+.5),0,Math.sin(at)*(R+.5))); pts.push(new V(Math.cos(at)*R,.05,Math.sin(at)*R)); pts.push(new V(Math.cos(at)*R,to.y,Math.sin(at)*R));}

}
function weighted(opts){let s=0; opts.forEach(o=>s+=o.w); let r=Math.random()*s; for(const o of opts){if((r-=o.w)<=0) return o;} return opts[0];}

function chooseActivity(c){
  const sp=c.sp, W=PERS[c.pers].w, opts=[], night=state.night>.6, rain=weather.raining;
  const add=(type,w,o)=>{w*=(W[type]||1); if(w>.001) opts.push(Object.assign({type,w},o));};
  if(c.leaving){const p=c.mesh.position,a=Math.atan2(p.z,p.x); return {type:'leave',target:new V(Math.cos(a)*17,0,Math.sin(a)*17),dur:.1,label:'heading back to the forest'};}
  if(sp.kind==='fly'){
    add('glide',3,{target:skyPoint(sp),dur:rand(.5,2),label:'gliding around the tree'});
    add('loop',sp.big?3:1.4,{loop:true,dur:sp.big?rand(14,24):rand(8,14),label:sp.big?'drifting around the canopy':'circling the canopy',emote:sp.big?'~':null});
    if(sp.perch&&treeInfo.perches.length){const sleepy=sp.nocturnal?!night:night; add(sleepy?'nap':'perch',sleepy?4:2.5,{target:perchPoint(),dur:rand(10,18),label:sleepy?'snoozing on a branch':'perched on a branch',emote:sleepy?'z':'♪'});}
    if(night) add('stargaze',1.2,{target:skyPoint(sp),dur:rand(5,9),label:'stargazing',emote:'✦'});
    if(sp.id==='glowmoth'){const l=decorOf('lantern'); if(l.length){const d=pick(l); add('bask',night?4:1,{target:d.pos.clone().add(new V(rand(-.4,.4),1.4+rand(0,.5),rand(-.4,.4))),dur:rand(6,10),label:'fluttering around a lantern',emote:'✦'});}}
    return weighted(opts);
  }
  if(sp.kind==='climb'&&treeInfo.perches.length) add('perch',3,{target:perchPoint(),dur:rand(8,14),label:'scampering along a branch',emote:'♪'});
  add('wander',sp.kind==='roots'?1.5:2,{target:groundPoint(sp),dur:rand(.5,2.5),label:'wandering about'});
  add('nap',night?2.5:.9,{target:napPoint(sp),dur:rand(12,20),label:'napping',emote:'z'});
  const pickD=t=>{const a=decorOf(t); return a.length?pick(a):null;};
  let d;
  if((d=pickD('berrybush'))) add('eat',2,Object.assign(decorSpot(d,.85,true),{dur:rand(6,10),label:'nibbling berries',emote:'nom'}));
  if((d=pickD('flowers'))) add('eat',1.2,Object.assign(decorSpot(d,.7,true),{dur:rand(5,8),label:'sniffing the flowers',emote:'~'}));
  if((d=pickD('pond'))) add('drink',1.6,Object.assign(decorSpot(d,1.5,true),{dur:rand(6,10),label:'splashing in the pond',emote:'~'}));
  if((d=pickD('musicstone'))) add('dance',1.6,Object.assign(decorSpot(d,1,false),{dur:rand(7,12),label:'dancing by the music stone',emote:'♪'}));
  if((d=pickD('mushring'))) add('dance',sp.mystic?3:1.1,Object.assign(decorSpot(d,.45,false),{dur:rand(7,12),label:'glowing in the mushroom ring',emote:'✦'}));
  if((d=pickD('bench'))) add('sit',1.3,Object.assign(benchSpot(d),{dur:rand(8,14),label:'resting on the bench',emote:'…'}));
  if((d=pickD('campfire'))) add('warm',night?2.6:.5,Object.assign(decorSpot(d,1.25,true),{dur:rand(8,14),label:'warming up by the campfire',emote:'~'}));
  if((d=pickD('lantern'))) add('bask',night?1.6:.25,Object.assign(decorSpot(d,.7,true),{dur:rand(6,10),label:'basking in the lantern glow',emote:'✦'}));
  if(decor.length){d=pick(decor); add('explore',.8,Object.assign(decorSpot(d,1.3,true),{dur:rand(3,5),label:'checking out the '+DECOR[d.type].name.toLowerCase(),emote:'?'}));}
  const others=creatures.filter(o=>o!==c&&!o.leaving&&o.sp.kind!=='fly'&&o.mesh.position.y<.5);
  if(others.length){
    const o=pick(others); add('play',1,{follow:o,partner:o,dur:rand(6,10),label:'playing tag with '+o.name,emote:'!'});
    const o2=pick(others); add('social',1.1,{target:near(o2.mesh.position,1),faceTarget:o2.mesh.position.clone(),partner:o2,dur:rand(6,10),label:'chatting with '+o2.name,emote:'…'});
  }
  add('hide',.4,{target:hidePoint(sp),dur:rand(8,14),label:'hiding behind the tree',emote:'…'});
  if(night) add('stargaze',1.2,{target:groundPoint(sp),dur:rand(6,10),label:'stargazing',emote:'✦'});
  if(rain) add('shelter',7,{target:napPoint(sp,true),dur:rand(8,12),label:'sheltering under the tree',emote:'!'});
  if(sp.kind==='roots') add('dig',2,{target:groundPoint(sp),dur:rand(6,10),label:'digging tunnels',emote:'…'});
  return weighted(opts);
}

function startActivity(c){
  const act=chooseActivity(c); c.act=act; c.moveT=0; c.follow=act.follow||null; resetPose(c);
  const p=c.mesh.position;
  if(act.loop){c.loopR=clamp(Math.hypot(p.x,p.z),treeInfo.r+2.5,c.sp.big?13:10); c.loopA=Math.atan2(p.z,p.x); c.loopDir=Math.random()<.5?-1:1; c.loopY=p.y; c.mode='do'; c.timer=act.dur; announce(c); return;}
  if(act.target) constrain(act.target,c.sp,c.leaving);
  c.path=c.follow?[]:(c.sp.kind==='climb'?climbPath(p,act.target):[act.target]);
  c.mode='move';
}
function arrive(c){
  if(c.act.type==='leave'){removeCreature(c); return;}
  c.mode='do'; c.timer=c.act.dur;
  if(c.act.faceYaw!=null) c.mesh.rotation.y=c.act.faceYaw;
  else if(c.act.faceTarget){const p=c.mesh.position; c.mesh.rotation.y=Math.atan2(c.act.faceTarget.x-p.x,c.act.faceTarget.z-p.z);}
  announce(c);
}
function announce(c){
  const a=c.act;
  if(a.emote){ if(Math.random()<.2) bubble(c,pick(PERS[c.pers].lines),3.2); else bubble(c,a.emote); }
  else if(Math.random()<.06) bubble(c,pick(PERS[c.pers].lines),3.2);
  if(a.type!=='wander'&&a.type!=='glide'&&Math.random()<.3) log(`${c.name} the ${c.sp.name} is ${a.label}.`);
}
const GAIN={wander:1,glide:1.5,loop:3,explore:3,nap:3,hide:2,stargaze:3,play:4,social:4,perch:3,dig:4,shelter:2};
function finish(c){
  const a=c.act, fav=PERS[c.pers].fav.includes(a.type);
  let gain=GAIN[a.type]!=null?GAIN[a.type]:5; if(fav) gain*=2;
  c.happy=clamp(c.happy+gain,5,100);
  if(a.partner&&creatures.includes(a.partner)) a.partner.happy=clamp(a.partner.happy+2,5,100);
  resetPose(c); c.follow=null; startActivity(c);
}
function resetPose(c){const P=c.mesh.userData.parts; P.g.position.y=0; P.g.scale.set(1,1,1); if(P.head) P.head.rotation.x=0;}
function lerpAngle(a,b,t){let d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI; return a+d*t;}
const tmpV=new V(), tmpT=new V();

function updateCreature(c,dt,t){
  const sp=c.sp, p=c.mesh.position, P=c.mesh.userData.parts, g=P.g, s=sp.size;
  const fly=sp.kind==='fly', climb=sp.kind==='climb';
  c.happy=clamp(c.happy-dt*.12,5,100); c.petCD=Math.max(0,c.petCD-dt);
  let moving=false;
  if(c.mode==='move'){
    c.moveT+=dt;
    const tgt=c.follow?tmpT.copy(c.follow.mesh.position):c.path[0];
    if(!tgt||(c.follow&&!creatures.includes(c.follow))){arrive(c);}
    else{
      tmpV.subVectors(tgt,p); if(!fly&&!climb) tmpV.y=0;
      const dist=tmpV.length(), reach=c.follow?.8+s*.4:.12;
      if(dist<=reach||c.moveT>(c.follow?8:22)){ if(c.follow) arrive(c); else {c.path.shift(); if(!c.path.length) arrive(c);} }
      else{const spd=sp.speed*(climb&&p.y>.3?.75:1); tmpV.multiplyScalar(Math.min(dist,spd*dt)/dist); p.add(tmpV); if(Math.abs(tmpV.x)+Math.abs(tmpV.z)>1e-4) c.mesh.rotation.y=lerpAngle(c.mesh.rotation.y,Math.atan2(tmpV.x,tmpV.z),1-Math.pow(.0005,dt)); moving=true;}
    }
  } else if(c.mode==='do'){
    c.timer-=dt; const a=c.act.type;
    if(a==='nap'){g.scale.y=lerp(g.scale.y,.8,dt*3); if(c.bubbleT<=0&&Math.random()<dt*.35) bubble(c,'z z');}
    else if(a==='dance'){g.position.y=Math.abs(Math.sin(t*7+c.seed))*.25*s; c.mesh.rotation.y+=dt*2.5; if(c.bubbleT<=0&&Math.random()<dt*.4) bubble(c,'♪');}
    else if(a==='eat'||a==='drink'){if(P.head) P.head.rotation.x=.45+Math.sin(t*12+c.seed)*.25;}
    else if(a==='dig'){g.position.y=lerp(g.position.y,-.28*s,dt*2); if(P.head) P.head.rotation.x=.45+Math.sin(t*14)*.3; if(Math.random()<dt*3) burst(p.clone().add(new V(0,.1,0)),0x7a5a3a,1,.6);}
    else if(a==='stargaze'){if(P.head) P.head.rotation.x=lerp(P.head.rotation.x,-.55,dt*3);}
    else if(a==='hide'){g.scale.setScalar(lerp(g.scale.x,.86,dt*2));}
    else if(a==='loop'){c.loopA+=dt*sp.speed/c.loopR*c.loopDir; p.x=Math.cos(c.loopA)*c.loopR; p.z=Math.sin(c.loopA)*c.loopR; p.y=c.loopY+Math.sin(t*.7+c.seed)*.5; c.mesh.rotation.y=Math.atan2(-Math.sin(c.loopA)*c.loopDir,Math.cos(c.loopA)*c.loopDir); moving=true;}
    else if(a==='play'&&c.follow&&creatures.includes(c.follow)){
      tmpV.subVectors(c.follow.mesh.position,p); tmpV.y=0; const dist=tmpV.length();
      if(dist>1){tmpV.multiplyScalar(Math.min(dist,sp.speed*1.25*dt)/dist); p.add(tmpV); c.mesh.rotation.y=Math.atan2(tmpV.x,tmpV.z); moving=true;}
      else g.position.y=Math.abs(Math.sin(t*10))*.12*s;
    }
    else {g.scale.y=1+Math.sin(t*2+c.seed)*.025;}
    if(c.timer<=0) finish(c);
  }
  // legs & bob
  if(P.legs.length){
    P.legs.forEach((L,i)=>{const ph=(i===0||i===3)?0:Math.PI; L.rotation.x=moving?Math.sin(t*sp.speed*7+ph)*.7:lerp(L.rotation.x,0,dt*8);});
    if(moving&&!fly) g.position.y=Math.abs(Math.sin(t*sp.speed*7))*(sp.hop?.14:.035)*s;
  }
  if(P.tail&&sp.shape==='quad') P.tail.rotation.y=Math.sin(t*3+c.seed)*.3;
  if(P.tail&&sp.shape==='whale') P.tail.rotation.x=Math.sin(t*1.5+c.seed)*.25;
  if(P.wings.length){
    const resting=c.mode==='do'&&(c.act.type==='perch'||c.act.type==='nap');
    const rate=sp.shape==='moth'?24:sp.shape==='whale'?1.6:sp.wings?9:sp.variant==='phoenix'?8:12;
    const amp=sp.shape==='whale'?.3:.7;

  else if(climb){ if(p.y<.3) p.y=Math.max(0,p.y); constrain(p,sp,c.leaving); }
  else { p.y=sp.kind==='float'?.35+Math.sin(t*2+c.seed)*.1:0; constrain(p,sp,c.leaving); }
}

let usedNames=new Set();
function freshName(){const free=NAMES.filter(n=>!usedNames.has(n)); const n=free.length?pick(free):pick(NAMES)+' '+(usedNames.size+1); usedNames.add(n); return n;}
function createCreature(id,o){
  o=o||{}; const sp=SPECIES[id], mesh=buildCreature(sp);
  const name=o.name||freshName(); usedNames.add(name);
  const c={uid:uid++,sp,mesh,name,pers:PERS[o.pers]?o.pers:pick(PERS_KEYS),happy:o.happy!=null?o.happy:70,mode:'idle',act:null,path:[],timer:0,follow:null,seed:Math.random()*10,petCD:0,bubbleT:0,visitor:!!o.visitor,leaving:false,moveT:0};
  mesh.userData.creature=c;
  const bb=new THREE.Box3().setFromObject(mesh), sz=bb.getSize(new V()), ctr=bb.getCenter(new V());
  const hb=new THREE.Mesh(boxGeo,hitMat); hb.scale.set(Math.max(sz.x,.9),Math.max(sz.y,.9),Math.max(sz.z,.9)); hb.position.copy(ctr); mesh.add(hb);
  c.height=bb.max.y+.2;
  if(o.x!=null){mesh.position.set(o.x,sp.kind==='fly'?skyPoint(sp).y:0,o.z);}
  else if(sp.kind==='fly'){const a=rand(0,TAU); mesh.position.set(Math.cos(a)*15,treeInfo.h+3,Math.sin(a)*15);}
  else {const a=rand(0,TAU); mesh.position.set(Math.cos(a)*(CLEAR_R-.2),0,Math.sin(a)*(CLEAR_R-.2));}
  constrain(mesh.position,sp);
  scene.add(mesh);
  c.bubbleEl=document.createElement('div'); c.bubbleEl.className='bubble'; c.bubbleEl.hidden=true; $('#bubbles').appendChild(c.bubbleEl);
  creatures.push(c); startActivity(c);
  return c;
}
function removeCreature(c){
  scene.remove(c.mesh); c.bubbleEl.remove(); const i=creatures.indexOf(c); if(i>=0) creatures.splice(i,1);
  usedNames.delete(c.name);
  if(selected===c) deselect(); if(visitor===c) visitor=null;
  creatures.forEach(o=>{if(o.follow===c) o.follow=null;});
}
function bubble(c,text,dur){c.bubbleEl.textContent=text; c.bubbleT=dur||2.4; c.bubbleEl.classList.toggle('talk',text.length>4);}

/* ---------- Particles ---------- */
const parts=[]; const partGeo=new THREE.BoxGeometry(.1,.1,.1);
function burst(pos,color,n,spread){for(let i=0;i<n;i++){let pt=parts.find(q=>q.life<=0); if(!pt){if(parts.length>90) return; pt={m:new THREE.Mesh(partGeo,M(color,true)),v:new V(),life:0}; scene.add(pt.m); parts.push(pt);} pt.m.material=M(color,true); pt.m.visible=true; pt.m.position.copy(pos); pt.v.set(rand(-1,1)*(spread||1),rand(1.5,3.2),rand(-1,1)*(spread||1)); pt.life=rand(.7,1.1);}}
function updateParts(dt){parts.forEach(q=>{if(q.life<=0) return; q.life-=dt; q.v.y-=4*dt; q.m.position.addScaledVector(q.v,dt); q.m.scale.setScalar(Math.max(.01,q.life)); if(q.life<=0) q.m.visible=false;});}

/* ---------- Camera ---------- */
const cam={theta:.7,phi:1.12,dist:12,tDist:12,look:new V(0,1,0),tLook:new V(0,1,0)};
function camDefaults(){const h=STAGES[state.stage].h; cam.tDist=8+h*1.55; cam.tLook.set(0,h*.42,0);}
function camLimits(){const h=STAGES[state.stage].h; return [4.5,22+h*1.6];}
function updateCamera(dt){
  cam.dist=lerp(cam.dist,cam.tDist,1-Math.pow(.002,dt)); cam.look.lerp(cam.tLook,1-Math.pow(.02,dt));
  const sp=Math.sin(cam.phi);
  camera.position.set(cam.look.x+cam.dist*sp*Math.sin(cam.theta),cam.look.y+cam.dist*Math.cos(cam.phi),cam.look.z+cam.dist*sp*Math.cos(cam.theta));
  camera.lookAt(cam.look);
  scene.fog.near=cam.dist+8; scene.fog.far=cam.dist+55;
}

/* ---------- Sky + weather ---------- */
const C_DAY=new THREE.Color(0x9ad3e6),C_DUSK=new THREE.Color(0xf0a882),C_NIGHT=new THREE.Color(0x182246),C_RAIN=new THREE.Color(0x7b8a95),sky=new THREE.Color();
const SUN_DAY=new THREE.Color(0xfff1d6),SUN_LOW=new THREE.Color(0xffb27a);
function updateSky(){
  const dt=(state.time%DAY)/DAY, s=Math.sin(dt*TAU)+.2, light=clamp(s*2.2+.15,0,1);
  state.light=light; state.night=1-light; state.dayT=dt;
  if(light<.5) sky.copy(C_NIGHT).lerp(C_DUSK,light*2); else sky.copy(C_DUSK).lerp(C_DAY,(light-.5)*2);
  sky.lerp(C_RAIN,weather.amt*.45*light);
  scene.background.copy(sky); scene.fog.color.copy(sky);
  const ang=dt*TAU;
  sun.position.set(Math.cos(ang)*22,Math.max(.15,Math.sin(ang)+.25)*26+4,10);
  sun.intensity=(.05+light*.85)*(1-weather.amt*.35);
  sun.color.copy(SUN_LOW).lerp(SUN_DAY,clamp((light-.4)*2,0,1));
  hemi.intensity=.22+light*.45; amb.intensity=.38*(1-light)+.05;
  starMat.opacity=Math.pow(state.night,2)*(1-weather.amt*.8); ffMat.opacity=state.night*(1-weather.amt*.6);
}
function clockLabel(){
  if(weather.raining) return '☂ Rain';
  const l=state.light, d=state.dayT;
  if(l>=.85) return '☀ Day'; if(l<=.12) return '☾ Night';
  return (d>.25&&d<.75)?'☼ Dusk':'☼ Dawn';
}
function updateWeather(dt){
  weather.t-=dt;
  if(weather.t<=0){
    if(weather.raining){weather.raining=false; weather.t=rand(140,260); log('The rain stopped. Everything smells fresh.'); creatures.forEach(c=>c.happy=clamp(c.happy+5,5,100));}
    else if(Math.random()<.6){weather.raining=true; weather.t=rand(25,45); log('A gentle rain begins to fall.'); creatures.forEach(c=>{if(c.mode==='do'&&c.sp.kind!=='fly') c.timer=Math.min(c.timer,rand(.3,2));});}
    else weather.t=rand(60,120);
  }
  weather.amt=lerp(weather.amt,weather.raining?1:0,dt*.6);
  rainMesh.visible=weather.amt>.02; rainMat.opacity=weather.amt*.55;
  if(rainMesh.visible){for(let i=0;i<RN;i++){let y=rainPos[i*6+1]-16*dt; if(y<0) y+=22; rainPos[i*6+1]=y; rainPos[i*6+4]=y+.6;} rainGeo.attributes.position.needsUpdate=true;}
}
function updateFireflies(t){
  if(ffMat.opacity<.01) return;
  ffSeed.forEach((f,i)=>{const a=f.a+t*f.s*.2; ffPos[i*3]=Math.cos(a)*f.r+Math.sin(t*f.s+f.o)*.6; ffPos[i*3+1]=f.y+Math.sin(t*f.s*1.7+f.o)*.4; ffPos[i*3+2]=Math.sin(a)*f.r+Math.cos(t*f.s+f.o)*.6;});
  ffGeo.attributes.position.needsUpdate=true;
}

/* ---------- Visitors ---------- */
function updateVisitor(dt){
  if(!visitor){
    visitorCD-=dt;
    if(visitorCD<=0){visitorCD=rand(15,30); if(state.night>.7&&state.stage>=1&&Math.random()<.5&&creatures.length<MAX_CREATURES){visitor=createCreature('starfox',{visitor:true}); log(`A Starlit Fox is peeking in from the forest. Tap it to say hello.`); toast('✦ A rare visitor has appeared!'); burst(visitor.mesh.position.clone().add(new V(0,.5,0)),0xc6b4ff,10);}}
  } else if(visitor.visitor&&!visitor.leaving&&state.night<.3){visitor.leaving=true; log('The Starlit Fox slipped back into the forest.'); startActivity(visitor);}
}

/* ---------- Economy ---------- */
const countOf=id=>creatures.filter(c=>c.sp.id===id&&!c.visitor).length;
const spCost=id=>Math.round(SPECIES[id].cost*Math.pow(1.15,countOf(id)));
const decorCost=t=>Math.round(DECOR[t].cost*Math.pow(1.12,decorOf(t).length));
const cRate=c=>c.visitor?0:c.sp.rate*(.4+.8*c.happy/100);
const totalRate=()=>creatures.reduce((s,c)=>s+cRate(c),0);
const layerName=sp=>({ground:'Clearing',float:'Clearing',roots:'Roots',climb:'Branches'})[sp.kind]||(sp.yMin>=.7?'Canopy':'Treetops');

function buyCreature(id){
  const sp=SPECIES[id], cost=spCost(id);
  if(state.essence<cost||state.stage<sp.stage) return;
  if(creatures.length>=MAX_CREATURES){toast('Your grove is full for now.'); return;}
  state.essence-=cost; const c=createCreature(id);
  burst(c.mesh.position.clone().add(new V(0,.5,0)),sp.mystic?0xc6b4ff:0xf5cc6e,10);
  chord([523.25,659.25,783.99]); toast(`${c.name} the ${c.pers} ${sp.name} moved in!`); log(`${c.name} the ${sp.name} arrived. They seem ${c.pers.toLowerCase()}.`);
  refreshPanel(); save();
}
function startPlacing(type){
  if(state.essence<decorCost(type)||state.stage<DECOR[type].stage) return;
  cancelPlacing();
  const d=buildDecor(type); const ghostMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.5,depthWrite:false});
  d.g.traverse(o=>{if(o.isMesh){o.material=ghostMat; o.castShadow=false;}});
  const ring=new THREE.Mesh(new THREE.RingGeometry(DECOR[type].fp+.1,DECOR[type].fp+.28,20),new THREE.MeshBasicMaterial({color:0x93d39d,transparent:true,opacity:.8,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2; ring.position.y=.03; d.g.add(ring);
  d.g.visible=false; scene.add(d.g);
  placing={type,ghost:d.g,ring,ok:false,pt:null};
  canvas.classList.add('placing'); $('#placeTxt').textContent=`Tap the ground to place the ${DECOR[type].name.toLowerCase()}`; $('#placebar').hidden=false;
  closePanel(); deselect();
}
function cancelPlacing(){if(!placing) return; scene.remove(placing.ghost); placing=null; canvas.classList.remove('placing'); $('#placebar').hidden=true;}
function placementOk(type,pt){
  const r=Math.hypot(pt.x,pt.z); if(r<minDecorR(type)||r>CLEAR_R-DECOR[type].fp-.2) return false;
  return decor.every(d=>Math.hypot(d.pos.x-pt.x,d.pos.z-pt.z)>DECOR[d.type].fp+DECOR[type].fp+.2);
}
function updateGhost(pt){
  if(!placing) return; if(!pt){placing.ghost.visible=false; placing.pt=null; return;}
  placing.pt=pt; placing.ok=placementOk(placing.type,pt); placing.ghost.visible=true; placing.ghost.position.set(pt.x,0,pt.z);
  if(placing.type==='bench') placing.ghost.rotation.y=Math.atan2(-pt.x,-pt.z);
  placing.ring.material.color.setHex(placing.ok?0x93d39d:0xf28b8b);
}
function tryPlace(pt){
  updateGhost(pt); const type=placing.type;
  if(!placing.ok){toast(Math.hypot(pt.x,pt.z)<minDecorR(type)?'Too close to the tree.':'Not enough room there. Try another spot.'); return;}
  const cost=decorCost(type); if(state.essence<cost){cancelPlacing(); return;}
  state.essence-=cost; const d=addDecor(type,pt.x,pt.z);
  burst(d.pos.clone().add(new V(0,.4,0)),0x93d39d,8); chord([659.25,783.99]);
  log(`You placed a ${DECOR[type].name.toLowerCase()}.`); cancelPlacing(); refreshPanel(); save();
}
function growTree(){
  const next=STAGES[state.stage+1]; if(!next||state.essence<next.cost) return;
  state.essence-=next.cost; state.stage++; buildTree(state.stage); camDefaults();
  burst(new V(0,next.h*.6,0),0x93d39d,20,2); burst(new V(0,next.h*.8,0),0xf5cc6e,14,2);
  chord([392,523.25,659.25,783.99,1046.5]); toast(`Your tree grew into a ${next.name}!`); log(next.unlock);
  creatures.forEach(c=>{if(c.mode!=='do'||c.act.type!=='loop') startActivity(c);});
  refreshPanel(); save();
}
function tapTree(pt,x,y){
  const gain=STAGES[state.stage].tap; state.essence+=gain; state.total+=gain; state.taps++;
  treeBounce=1; burst(pt,0xf5cc6e,5,.8); tone(pick(PENTA),.45,.05);
  const el=document.createElement('div'); el.className='plus'; el.textContent='+'+gain; el.style.left=x+'px'; el.style.top=y+'px'; $('#fx').appendChild(el); setTimeout(()=>el.remove(),950);
  if(state.taps>=5) $('#hint').hidden=true;
}

/* ---------- Selection + card ---------- */
const ring=new THREE.Mesh(new THREE.RingGeometry(.45,.6,16),new THREE.MeshBasicMaterial({color:0xf5cc6e,side:THREE.DoubleSide,transparent:true,opacity:.9}));
ring.rotation.x=-Math.PI/2; ring.visible=false; scene.add(ring);
function select(c,doFollow){

}
function deselect(){const wasF=follow; selected=null; follow=null; ring.visible=false; $('#card').hidden=true; if(wasF) camDefaults();}
function moodWord(h){return h>=80?'Overjoyed':h>=60?'Happy':h>=40?'Content':h>=20?'A bit lonely':'Gloomy';}
function renderCard(){
  const c=selected; if(!c) return;
  $('#cName').textContent=c.name;

}
const treatCost=c=>Math.max(10,Math.round(c.sp.rate*30));
function pet(){
  const c=selected; if(!c||c.petCD>0) return;
  c.petCD=6; c.happy=clamp(c.happy+(c.pers==='Grumpy'?5:9),5,100);
  const napping=c.mode==='do'&&c.act.type==='nap';
  bubble(c,napping?'*wakes* oh, it\'s you ♥':c.pers==='Grumpy'?'hmph... okay, that was nice.':c.pers==='Shy'?'♥ ...thank you':'♥',3);

function treat(){
  const c=selected; if(!c) return; const tc=treatCost(c); if(state.essence<tc) return;
  state.essence-=tc; c.happy=clamp(c.happy+22,5,100);
  bubble(c,c.pers==='Hungry'?'BEST. DAY. EVER. ♥':'nom nom ♥',3);
  burst(c.mesh.position.clone().add(new V(0,c.height*.8,0)),0xf5cc6e,8,.6); chord([523.25,659.25,783.99]); renderCard();
}
function befriend(){
  const c=selected; if(!c||!c.visitor) return;
  c.visitor=false; c.leaving=false; visitor=null; c.happy=90;
  toast(`${c.name} the Starlit Fox decided to stay!`); log(`${c.name} the Starlit Fox curled up by the tree. Welcome home.`);
  bubble(c,'✦ ♥ ✦',3); burst(c.mesh.position.clone().add(new V(0,.6,0)),0xc6b4ff,14); chord([523.25,659.25,783.99,1046.5]);
  startActivity(c); renderCard(); refreshPanel(); save();
}

/* ---------- Panels ---------- */
function renderPanel(tab){
  if(tab==='creatures'){
    return `<div class="ph"><h2>Invite creatures</h2><p>Each one brings essence over time. Happier creatures bring more.</p></div><div class="list">${SHOP.map(id=>{const sp=SPECIES[id],locked=state.stage<sp.stage,cost=spCost(id);
      return `<div class="item${locked?' locked':''}"><span class="sw" style="--a:${hex(sp.a)};--b:${hex(sp.b)}"></span><div class="it-main"><div class="it-name">${sp.name}${sp.mystic?'<span class="chip">MYSTICAL</span>':''}</div><div class="it-sub">${locked?'Grow to '+STAGES[sp.stage].name+' to unlock':`${layerName(sp)} · +${fmtR(sp.rate)}/s · you have ${countOf(id)}`}</div></div>${locked?'<span class="lock">LOCKED</span>':`<button class="btn buy" data-buy="${id}" data-cost="${cost}">${fmt(cost)} ✦</button>`}</div>`;}).join('')}</div><p class="foot">Rare visitors sometimes wander in at night.</p>`;
  }
  if(tab==='decor'){
    return `<div class="ph"><h2>Decorate the grove</h2><p>Decor gives creatures new things to do. Pick one, then tap the ground.</p></div><div class="list">${DECOR_ORDER.map(t=>{const D=DECOR[t],locked=state.stage<D.stage,cost=decorCost(t);
      return `<div class="item${locked?' locked':''}"><div class="it-main"><div class="it-name">${D.name}</div><div class="it-sub">${locked?'Grow to '+STAGES[D.stage].name+' to unlock':D.desc+(decorOf(t).length?` · placed ${decorOf(t).length}`:'')}</div></div>${locked?'<span class="lock">LOCKED</span>':`<button class="btn buy" data-decor="${t}" data-cost="${cost}">${fmt(cost)} ✦</button>`}</div>`;}).join('')}</div>`;
  }
  if(tab==='friends'){
    const list=creatures.filter(c=>!c.visitor);
    if(!list.length) return `<div class="ph"><h2>Your friends</h2><p>No one lives here yet. Invite someone from the Creatures tab.</p></div>`;
    return `<div class="ph"><h2>Your friends</h2><p>${list.length} creature${list.length>1?'s':''} call this tree home. Tap one to visit.</p></div><div class="list">${list.map(c=>`<div class="item clickable" data-friend="${c.uid}"><span class="sw" style="--a:${hex(c.sp.a)};--b:${hex(c.sp.b)}"></span><div class="it-main"><div class="it-name">${c.name} <span class="it-sub">${c.pers} ${c.sp.name}</span></div><div class="it-sub" data-act="${c.uid}">${c.act?c.act.label:''}</div></div><span class="mini-bar"><i data-mood="${c.uid}" style="width:${c.happy}%"></i></span></div>`).join('')}</div>`;
  }
  if(tab==='tree'){
    const S=STAGES[state.stage], N=STAGES[state.stage+1];
    return `<div class="ph"><h2>${S.name}</h2><p>Every tap on the tree gathers ${S.tap} essence.</p></div><div class="stages">${STAGES.map((_,i)=>`<span class="${i<=state.stage?'on':''}"></span>`).join('')}</div>${N?`<div class="tree-next"><div><div class="it-name">Next: ${N.name}</div><div class="it-sub">${N.unlock}</div></div><button class="btn gold" data-grow="1" data-cost="${N.cost}">Grow · ${fmt(N.cost)} ✦</button></div>`:`<div class="tree-next"><div class="it-name">Fully grown</div><div class="it-sub">Your World Tree is complete. Keep filling it with friends.</div></div>`}<div class="stats"><div><b>${creatures.filter(c=>!c.visitor).length}</b><small>FRIENDS</small></div><div><b>${decor.length}</b><small>DECOR</small></div><div><b>${fmt(state.total)}</b><small>GATHERED</small></div></div>`;
  }
  return '';
}
function openPanel(tab){openTab=tab; $('#panel').hidden=false; document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab))); $('#panelBody').innerHTML=renderPanel(tab); updateAfford(); if(innerWidth<=640&&selected) deselect();}
function closePanel(){openTab=null; $('#panel').hidden=true; document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected','false'));}
function refreshPanel(){if(!openTab) return; const pb=$('#panel'), st=pb.scrollTop; $('#panelBody').innerHTML=renderPanel(openTab); pb.scrollTop=st; updateAfford();}
function updateAfford(){document.querySelectorAll('#panelBody [data-cost]').forEach(b=>{b.disabled=state.essence<+b.dataset.cost;});}
function updateFriendsLive(){if(openTab!=='friends') return; creatures.forEach(c=>{const a=document.querySelector(`[data-act="${c.uid}"]`), m=document.querySelector(`[data-mood="${c.uid}"]`); if(a&&c.act) a.textContent=c.act.label; if(m) m.style.width=c.happy+'%';});}

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{ensureAudio(); openTab===b.dataset.tab?closePanel():openPanel(b.dataset.tab);}));
$('#panelBody').addEventListener('click',e=>{

  if(t.dataset.buy) buyCreature(t.dataset.buy);
  else if(t.dataset.decor) startPlacing(t.dataset.decor);
  else if(t.dataset.grow) growTree();
  else if(t.dataset.friend){const c=creatures.find(c=>c.uid===+t.dataset.friend); if(c){select(c,true); if(innerWidth<=640) closePanel();}}
});
$('#cClose').addEventListener('click',deselect);
$('#cPet').addEventListener('click',pet);
$('#cTreat').addEventListener('click',treat);

/* ---------- Log + toast ---------- */
const logLines=[];
function log(text){logLines.push({text,t:performance.now()}); if(logLines.length>3) logLines.shift(); renderLog();}
function renderLog(){const now=performance.now(); $('#log').innerHTML=logLines.map((l,i)=>`<div style="opacity:${Math.max(0,Math.min(1,(14000-(now-l.t))/3000))*(i===logLines.length-1?1:.7)}">${l.text}</div>`).join('');}
let toastTimer=0;
function toast(text){const t=$('#toast'); t.textContent=text; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,2800);}

/* ---------- Sound ---------- */
let actx=null; const PENTA=[523.25,587.33,659.25,783.99,880,1046.5];
function ensureAudio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;}} if(actx&&actx.state==='suspended') actx.resume().catch(()=>{});}
function tone(f,d,v,delay){if(!state.sound||!actx) return; try{const t0=actx.currentTime+(delay||0), o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+d); o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+d+.05);}catch(e){}}
function chord(fs){fs.forEach((f,i)=>tone(f,.5,.04,i*.07));}

/* ---------- Input ---------- */
const raycaster=new THREE.Raycaster(), ndc=new THREE.Vector2(), groundPlane=new THREE.Plane(new V(0,1,0),0);
const pointers=new Map(); let downPos=null, dragging=false, pinchD=0, lastInteract=0;
function setRay(x,y){const r=canvas.getBoundingClientRect(); ndc.set((x-r.left)/r.width*2-1,-((y-r.top)/r.height)*2+1); raycaster.setFromCamera(ndc,camera);}
function groundAt(x,y){setRay(x,y); const p=new V(); return raycaster.ray.intersectPlane(groundPlane,p)?p:null;}
function pDist(){const a=[...pointers.values()]; return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;}
canvas.addEventListener('pointerdown',e=>{
  ensureAudio(); try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); lastInteract=performance.now();
  if(pointers.size===1){downPos={x:e.clientX,y:e.clientY}; dragging=false;} else {dragging=true; pinchD=pDist();}
});
canvas.addEventListener('pointermove',e=>{
  if(placing&&e.pointerType==='mouse') updateGhost(groundAt(e.clientX,e.clientY));
  if(!pointers.has(e.pointerId)) return;
  const prev=pointers.get(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); lastInteract=performance.now();
  if(pointers.size>=2){const d=pDist(), lim=camLimits(); cam.tDist=clamp(cam.tDist*pinchD/d,lim[0],lim[1]); pinchD=d; return;}
  if(!dragging&&downPos&&Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>6) dragging=true;
  if(dragging){cam.theta-=(e.clientX-prev.x)*.008; cam.phi=clamp(cam.phi-(e.clientY-prev.y)*.006,.5,1.45);}
});
function endPointer(e,cancel){
  const had=pointers.has(e.pointerId); pointers.delete(e.pointerId);
  if(!cancel&&had&&!dragging&&downPos&&pointers.size===0) handleTap(e.clientX,e.clientY);
  if(pointers.size===0){downPos=null; setTimeout(()=>{dragging=false;},0);}
}
canvas.addEventListener('pointerup',e=>endPointer(e,false));
canvas.addEventListener('pointercancel',e=>endPointer(e,true));
canvas.addEventListener('wheel',e=>{e.preventDefault(); const lim=camLimits(); cam.tDist=clamp(cam.tDist*(1+Math.sign(e.deltaY)*.1),lim[0],lim[1]); lastInteract=performance.now();},{passive:false});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(placing) cancelPlacing(); else if(selected) deselect(); else closePanel();}});

function handleTap(x,y){
  if(placing){const pt=groundAt(x,y); if(pt) tryPlace(pt); return;}
  setRay(x,y);
  const ch=raycaster.intersectObjects(creatures.map(c=>c.mesh),true);
  for(const h of ch){let o=h.object; while(o){if(o.userData.creature){select(o.userData.creature,false); return;} o=o.parent;}}
  if(treeGroup){const th=raycaster.intersectObject(treeGroup,true); if(th.length){tapTree(th[0].point,x,y); return;}}
  if(selected) deselect();
}

/* ---------- Save / load ---------- */
function serialize(){
  return {v:1,essence:state.essence,stage:state.stage,time:state.time,taps:state.taps,total:state.total,sound:state.sound,
    creatures:creatures.filter(c=>!c.visitor).map(c=>({s:c.sp.id,n:c.name,p:c.pers,h:Math.round(c.happy),x:+c.mesh.position.x.toFixed(2),z:+c.mesh.position.z.toFixed(2)})),
    decor:decor.map(d=>({t:d.type,x:+d.pos.x.toFixed(2),z:+d.pos.z.toFixed(2),r:+d.rot.toFixed(2)})),saved:Date.now()};
}
function save(){try{localStorage.setItem(STORE,JSON.stringify(serialize()));}catch(e){}}
function readStore(){try{const s=localStorage.getItem(STORE); return s?JSON.parse(s):null;}catch(e){return null;}}
function load(data){
  const ok=data&&data.v===1;
  state.essence=ok&&isFinite(data.essence)?data.essence:25;
  state.stage=ok?clamp(data.stage|0,0,STAGES.length-1):0;
  state.time=ok&&isFinite(data.time)?data.time:DAY*.03;
  state.taps=ok?data.taps|0:0; state.total=ok&&isFinite(data.total)?data.total:0;
  state.sound=ok&&data.sound===false?false:true; $('#snd').textContent=state.sound?'♪ On':'♪ Off';
  buildTree(state.stage);
  if(ok&&Array.isArray(data.decor)) data.decor.forEach(d=>{if(DECOR[d.t]) addDecor(d.t,+d.x||3,+d.z||3,d.r);});
  else {addDecor('lantern',3.2,2.2); addDecor('flowers',-3,1.8);}
  if(ok&&Array.isArray(data.creatures)) data.creatures.forEach(c=>{if(SPECIES[c.s]) createCreature(c.s,{name:c.n,pers:c.p,happy:c.h,x:c.x,z:c.z});});
  else createCreature('rabbit',{name:'Clover',pers:'Lazy',happy:75,x:2.5,z:-2.5});
  if(state.taps>=5) $('#hint').hidden=true;
  camDefaults(); cam.dist=cam.tDist+6; cam.look.copy(cam.tLook);
  if(ok&&data.saved){const away=Math.min((Date.now()-data.saved)/1000,8*3600); const earned=totalRate()*away*.5; if(away>60&&earned>=1){state.essence+=earned; state.total+=earned; setTimeout(()=>toast(`While you were away, your grove gathered ${fmt(earned)} essence.`),600);}}
  setTimeout(()=>log(ok?'Welcome back to the grove.':'A little sapling sways in a quiet clearing. Clover the rabbit is already dozing nearby.'),300);
}

/* ---------- Bubbles ---------- */
const proj=new V();
function updateBubbles(dt){
  const w=canvas.clientWidth, h=canvas.clientHeight;
  creatures.forEach(c=>{
    if(c.bubbleT>0){
      c.bubbleT-=dt; proj.copy(c.mesh.position); proj.y+=c.height+c.mesh.userData.parts.g.position.y; proj.project(camera);
      if(proj.z>1||c.bubbleT<=0){c.bubbleEl.hidden=true; return;}
      c.bubbleEl.hidden=false; c.bubbleEl.style.transform=`translate(${((proj.x+1)/2*w).toFixed(1)}px,${((1-proj.y)/2*h-8).toFixed(1)}px) translate(-50%,-100%)`;
    } else if(!c.bubbleEl.hidden) c.bubbleEl.hidden=true;
  });
}

/* ---------- Loop ---------- */
let PX=3;
function resize(){const w=innerWidth,h=innerHeight; PX=Math.max(2,Math.round(Math.min(w,h)/280)); renderer.setPixelRatio(1); renderer.setSize(Math.ceil(w/PX),Math.ceil(h/PX),false); camera.aspect=w/h; camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=performance.now(), hudT=0, saveT=0, noteT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000); last=now; const t=now/1000;
  state.time+=dt; updateSky(); updateWeather(dt); updateVisitor(dt);
  const rate=totalRate(); state.essence+=rate*dt; state.total+=rate*dt;
  for(let i=creatures.length-1;i>=0;i--) if(creatures[i]) updateCreature(creatures[i],dt,t);
  // decor life
  lightPool.forEach(l=>{const d=l.userData.d; if(!d){l.intensity=0; return;} l.intensity=d.type==='campfire'?(.4+state.night)*d.light.k*(.85+.15*Math.sin(t*13)+.08*Math.sin(t*29)):state.night*d.light.k;});
  noteT-=dt;
  decor.forEach(d=>{
    d.flames.forEach((f,i)=>{f.scale.y=(.26-.08*i)*1.4*(.8+.35*Math.abs(Math.sin(t*(9+i*3)+i)));});
    d.caps.forEach((c,i)=>{const k=1+Math.sin(t*2+i)*.08*(.3+state.night); c.scale.set(.26*k,.1,.26*k);});
    if(d.notes&&noteT<=0&&Math.random()<.25) burst(d.pos.clone().add(new V(0,1.1,0)),0xc6b4ff,1,.3);
  });
  if(noteT<=0) noteT=.6;
  treeInfo.twinkle.forEach((m,i)=>m.scale.setScalar(.7+.4*Math.abs(Math.sin(t*1.5+i))));
  if(treeGroup){treeBounce=Math.max(0,treeBounce-dt*3); const k=Math.sin((1-treeBounce)*Math.PI*3)*treeBounce*.05; treeGroup.scale.set(1-k*.5,1+k,1-k*.5); treeGroup.rotation.z=Math.sin(t*.6)*.006;}
  updateParts(dt); updateFireflies(t);
  if(selected){ring.position.set(selected.mesh.position.x,selected.sp.kind==='fly'?selected.mesh.position.y-.3:.03,selected.mesh.position.z); ring.rotation.z+=dt;}
  if(follow){cam.tLook.set(follow.mesh.position.x,follow.mesh.position.y+.5,follow.mesh.position.z); cam.tDist=Math.max(camLimits()[0]+1,Math.min(cam.tDist,7+follow.sp.size*3));}
  if(!dragging&&!follow&&!reduceMotion&&now-lastInteract>9000) cam.theta+=dt*.025;
  updateCamera(dt); renderer.render(scene,camera); updateBubbles(dt);
  hudT-=dt;
  if(hudT<=0){hudT=.25;
    $('#ess').textContent=fmt(state.essence); $('#rate').textContent=`+${fmtR(rate)}/S · ${STAGES[state.stage].name.toUpperCase()}`;
    $('#clock').textContent=clockLabel(); updateAfford(); if(selected) renderCard(); updateFriendsLive(); renderLog();
  }
  saveT-=dt; if(saveT<=0){saveT=5; save();}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden) save();});
window.addEventListener('pagehide',save);

function boot(hot){
  resize();
  load(hot&&hot.state?hot.state:readStore());
  last=performance.now(); requestAnimationFrame(frame);
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({state:serialize()}));}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(boot); else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
</body>
